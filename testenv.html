<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b3524">
<title>סביבת בדיקה — מערך שאטלים 820</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3ee; --card:#fff; --ink:#1b211a; --muted:#5d6659; --line:#e1e4da; --soft:#f7f8f4;
  --olive:#2b3524; --olive2:#3e4c33; --amber:#e8a820; --amber-soft:#fdf3dc;
  --green:#2c8547; --green-soft:#e5f3e9; --red:#c43a2d; --red-soft:#fbe9e7; --blue:#2a5ea6; --blue-soft:#e6eefa;
  --r:14px; --shadow:0 1px 2px rgba(20,30,15,.06),0 4px 14px rgba(20,30,15,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{overflow-wrap:break-word}
body{font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.hide{display:none!important}

/* top bar */
.top{background:var(--olive);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;white-space:nowrap}
.logo .n{background:var(--amber);color:var(--olive);border-radius:7px;padding:1px 7px;font-weight:900;letter-spacing:.5px}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.who .role{opacity:.75}
.iconbtn{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:9px;padding:7px 10px;cursor:pointer;font-size:13px}
.iconbtn:hover{background:rgba(255,255,255,.2)}
.demo-ribbon{background:var(--amber);color:var(--olive);text-align:center;font-size:12.5px;font-weight:700;padding:5px 10px}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.narrow{max-width:640px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:16px}
@media (max-width:640px){.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible}.tabs .tab{justify-content:center;text-align:center}}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.badge{background:var(--red);color:#fff;border-radius:999px;font-size:11.5px;padding:0 7px;line-height:19px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.end{justify-content:flex-end}
.between{justify-content:space-between}
.grow{flex:1}
h1,h2,h3{margin:0;line-height:1.2}
.section-title{font-size:13px;font-weight:700;color:var(--muted);margin:22px 2px 10px;letter-spacing:.2px}

/* buttons */
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:filter .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--olive);color:#fff}
.btn.primary:hover{filter:brightness(1.15)}
.btn.amber{background:var(--amber);color:var(--olive)}
.btn.ghost{background:var(--soft);border:1px solid var(--line)}
.btn.ghost:hover{background:#eef0e8}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.lnk{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-weight:600}
.lnk.chg{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 10px;border-radius:10px;font-size:13px;text-decoration:underline;text-underline-offset:3px;flex:0 0 auto}
.lnk.chg:hover{background:var(--blue-soft)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.region{background:var(--olive2);color:#fff}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.wait{background:#eef0ea;color:var(--muted)}
.chip.full{background:var(--red);color:#fff}
.chip.info{background:var(--blue-soft);color:var(--blue)}
.chip.warn{background:var(--amber-soft);color:#94680a}

/* forms */
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.in{width:100%;border:1px solid #cfd4c6;background:#fff;border-radius:10px;padding:11px 12px;outline:none}
input[dir=ltr].in{text-align:right}
.in:focus{border-color:var(--olive2);box-shadow:0 0 0 3px rgba(62,76,51,.15)}
textarea.in{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

/* login */
.login-wrap{max-width:440px;margin:0 auto;padding:34px 16px 60px}
.brand{text-align:center;margin-bottom:22px}
.brand .busic{width:74px;height:74px;margin:0 auto 12px;background:var(--olive);border-radius:20px;display:grid;place-items:center;box-shadow:var(--shadow)}
.brand h1{font-size:28px;font-weight:900}
.brand h1 b{color:var(--olive2);background:var(--amber);padding:0 8px;border-radius:8px}
.brand p{color:var(--muted);margin:8px 0 0}
.login{padding:18px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.demo-box{margin-top:16px;padding:14px;border:1px dashed #c9b27a;background:#fffaf0;border-radius:var(--r)}
.demo-box h4{margin:0 0 8px;font-size:14px}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}

/* soldier */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.hello h2{font-size:23px;font-weight:800}
.hello.band{position:relative;overflow:hidden;display:block;border-radius:16px;padding:16px 18px 30px;background:linear-gradient(180deg,#dcebf2 0%,#eef1e8 55%,#fcebd2 100%);border:1px solid #e3e6dc}
.band .band-hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:40px}
.band .band-txt{position:relative}
.band .band-eyebrow{color:#4d5a43;font-weight:700}
.band h1{margin:0;color:#1f2a1c}
.band .band-sub{margin:4px 0 0;color:#3c4636}
.rules{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.day{font-size:14px;font-weight:800;margin:20px 2px 9px;color:var(--olive2)}
.sc{padding:14px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start}
.sc.mine{border-color:var(--olive2);box-shadow:0 0 0 2px rgba(62,76,51,.18),var(--shadow)}
.tbig{font-size:26px;font-weight:900;letter-spacing:.5px;line-height:1;padding-top:2px;font-variant-numeric:tabular-nums}
.route{font-weight:800;font-size:16px}
.meta{font-size:13px;color:var(--muted)}
.sc .foot{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.bar{height:7px;background:#e9ece4;border-radius:9px;overflow:hidden;min-width:90px;flex:1}
.bar i{display:block;height:100%;border-radius:9px;background:var(--green)}
.bar.mid i{background:var(--amber)} .bar.max i{background:var(--red)}
.seatsn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.alert{border-radius:var(--r);padding:16px;margin-bottom:14px}
.alert.red{background:var(--red-soft);border:1px solid #f0c3bd}
.alert h3{font-size:17px;color:var(--red);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.alert p{margin:6px 0}
.empty{text-align:center;color:var(--muted);padding:36px 16px}
.stops{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
.stp{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:600}
.stopchip{background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:0 7px;font-size:12px;font-weight:700;margin-inline-start:4px}
.stopgrp{font-size:12.5px;font-weight:800;color:var(--olive2);padding:10px 4px 2px}

/* staff */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:6px}
.stat{padding:14px}
.stat .v{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600}
.stat.red .v{color:var(--red)}
.regions{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.regbox{padding:14px}
.regbox > summary{cursor:pointer;list-style:none;margin-bottom:0}.regbox > summary::-webkit-details-marker{display:none}
.regbox[open] > summary{margin-bottom:10px}
.regbox > summary h3::before{content:"◂ ";color:var(--muted);font-size:13px}.regbox[open] > summary h3::before{content:"▾ "}
.ovsum{display:flex;flex-wrap:wrap;gap:6px 18px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.ovsum b{font-size:17px;font-variant-numeric:tabular-nums}
.attn{margin-bottom:8px}
.attn-list{list-style:none;padding:0;margin:0 0 8px;display:grid;gap:8px}
.attn-i{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-inline-start:5px solid var(--line)}
.attn-i .lv{font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.attn-i.lv-red{border-inline-start-color:var(--red)}.attn-i.lv-red .lv{background:var(--red-soft);color:#8f251c}
.attn-i.lv-amber{border-inline-start-color:#d09412}.attn-i.lv-amber .lv{background:var(--amber-soft);color:#6b4a05}
.attn-i.lv-blue{border-inline-start-color:var(--blue)}.attn-i.lv-blue .lv{background:var(--blue-soft);color:var(--blue)}
.attn-ok{padding:12px 14px;color:#1f4d2c;font-weight:700}
@media (max-width:640px){
  .attn-i{grid-template-columns:1fr;gap:6px}.attn-i .lv{justify-self:start}
  table.t.cards thead{display:none}
  table.t.cards,table.t.cards tbody,table.t.cards tr,table.t.cards td{display:block;width:100%}
  table.t.cards tr{border-bottom:1px solid var(--line);padding:10px 12px}
  table.t.cards td{border:0;padding:2px 0;text-align:right!important;white-space:normal!important}
  table.t.cards td[data-label]::before{content:attr(data-label) ": ";color:var(--muted);font-size:12.5px}
  table.t.cards td.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  table.t.cards td.acts .btn{flex:1 1 auto}
}
.reghead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.reghead h3{font-size:17px;font-weight:800}
.mini{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--soft);display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.mini:hover{border-color:#b9c0ad;background:#fff}
.mini.isfull{background:#fff6f5;border-color:#efc6c1}
.mini .tm{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.mini .sub{grid-column:2/4;font-size:12.5px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar select{width:auto;padding:8px 10px}
.shc{margin-bottom:10px;overflow:hidden}
.shc-h{display:grid;grid-template-columns:auto 1fr minmax(150px,220px);gap:4px 14px;align-items:center;padding:13px 14px;cursor:pointer}
.shc-h:hover{background:var(--soft)}
.seatbox{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.seatbox .row{justify-content:space-between}
.shc-b{border-top:1px solid var(--line);padding:12px 14px;background:#fcfcfa}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pl{list-style:none;margin:0;padding:0}
.pr{display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;align-items:center;padding:9px 4px;border-bottom:1px solid #eef0ea}
.pr:last-child{border-bottom:0}
.pr .idx{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:center}
.pr .nm{font-weight:700}
.pr .ph{font-size:12.5px;color:var(--muted)}
.pr .acts{display:flex;gap:5px;align-items:center}
.mk{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.mk.y.on{background:var(--green);border-color:var(--green);color:#fff}
.mk.n.on{background:var(--red);border-color:var(--red);color:#fff}
.mk.x{color:var(--muted)}
.pr.ns{background:#fff5f4}
.blk{padding:14px;margin-bottom:10px}
.appeal{background:var(--soft);border-right:3px solid var(--amber);padding:8px 10px;border-radius:8px;margin:8px 0;font-size:14px}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
table.t th{font-size:12.5px;color:var(--muted);font-weight:700;background:var(--soft)}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,12,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{font-size:19px;margin-bottom:12px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:var(--olive);color:#fff;padding:10px 16px;border-radius:11px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;animation:pop .2s ease}
.tst.err{background:var(--red)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}


/* opening screen — photographic hero (visual reference 12/11) */
.hx{position:relative;overflow:hidden;color:#fff;background:linear-gradient(180deg,#22301d 0%,#2c3a26 100%)}
.hx-in{position:relative;z-index:1;width:100%;max-width:1080px;margin:0 auto;display:flex;flex-direction:column}
.hx-head{padding:16px 16px 18px;text-align:center}
.hx-logo{display:inline-flex;gap:8px;align-items:center;font-weight:800;font-size:13.5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:5px 13px;color:#fff}
.hx-logo b{background:var(--amber);color:#24301f;border-radius:6px;padding:0 7px;font-weight:900}
.hx .eyebrow{margin:14px 0 5px;font-weight:600;font-size:14px;color:rgba(255,255,255,.88)}
.hx h1{margin:0;font-size:28px;line-height:1.22;font-weight:900;text-wrap:balance;color:#fff}

@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
.mprog{margin:0 0 14px}
.mprog .stepno{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted)}
.mprog .stepno b{color:var(--olive2)}
.mprog ol{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0;margin:0}
.mprog li{font-size:11.5px;color:#5d6659;border-top:4px solid #e6e9df;padding-top:5px;text-align:center}
.mprog li.done{border-color:#2c6e3f;color:#1f4d2c;font-weight:700}
.mprog li.cur{border-color:var(--olive2);color:var(--ink);font-weight:800}
.step-t{font-size:19px;font-weight:800;margin-bottom:4px}
.rtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rtile{border:1.5px solid var(--line);background:var(--soft);border-radius:14px;padding:16px 10px;cursor:pointer;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s}
.rtile:hover{border-color:var(--olive2);background:#fff;transform:translateY(-1px);box-shadow:var(--shadow)}
.rtile .ri{display:grid;place-items:center;color:var(--olive2)}.rtile.on .ri{color:#fff}
.picked .ri{display:inline-grid;vertical-align:-5px;color:var(--olive2)}
.rtile.on{border-color:var(--olive);background:var(--olive);color:#fff}
.rtiles .rtile:last-child:nth-child(odd){grid-column:1/-1}
.picked{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:14px}
.staff-link{text-align:center;margin-top:16px}
/* day chips */
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:4px -2px 6px;scrollbar-width:thin}
.dchip{flex:0 0 auto;min-width:74px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.dchip .dw{font-weight:800;font-size:14px}.dchip .dd{font-size:12px;color:var(--muted)}
.dchip .dn{font-size:11px;color:var(--muted);margin-top:2px}
.dchip.on{background:var(--olive);border-color:var(--olive);color:#fff}.dchip.on .dd,.dchip.on .dn{color:rgba(255,255,255,.8)}
.dchip .dot{position:absolute;top:3px;left:7px;font-size:11px;line-height:1;color:var(--amber)}
.bucket{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--olive2);margin:16px 2px 8px}
.bucket .ct{font-weight:600;color:var(--muted);font-size:12.5px}
.mine-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.mine-it{flex:0 0 auto;background:var(--amber-soft);border:1px solid #f0d58f;border-radius:12px;padding:7px 11px;cursor:pointer;font-size:13px}
.mine-it b{font-size:14px}
.regchip{cursor:pointer;border:0}
/* split layout + side table */
.split{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;align-items:start}
.side{position:sticky;top:66px;max-height:calc(100vh - 84px);overflow:auto;padding:0}
.side-h{position:sticky;top:0;background:var(--card);padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;z-index:1}
.side-h h3{font-size:15px;font-weight:800}
table.reg{width:100%;border-collapse:collapse;font-size:13px}
table.reg th{position:sticky;top:51px;background:var(--soft);text-align:right;padding:7px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
table.reg td{padding:7px 8px;border-bottom:1px solid #eef0ea;vertical-align:top}
table.reg tr.grp td{background:#f4f6ef;font-weight:800;color:var(--olive2);font-size:12.5px}
table.reg td.st-ok{color:var(--green);font-weight:800}table.reg td.st-bad{color:var(--red);font-weight:800}
@media (max-width:1000px){.split{grid-template-columns:1fr}.side{position:static;max-height:none}}

/* ===== v6: waitlist ===== */
.wait-box{background:var(--amber-soft);border:1px solid #f0d58f;color:#4f3604;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.trip.wait{border-color:#f0d58f}
.wait-box.offer{background:#e6f4ea;border-color:#9fd3ae;color:#0f4d24}
.chip.offer{background:#e6f4ea;color:#0f4d24}
ul.rules{margin:8px 0 10px;padding-inline-start:20px;line-height:1.55}
ul.rules li{margin:3px 0}
.rulesbox{padding:10px 14px;margin-bottom:10px}.rulesbox summary{cursor:pointer;font-weight:700}

<script>
/* ======================================================================
   הגדרות חיבור — להפעלה אמיתית מלא את שני הערכים מ-Supabase
   (Project Settings > API). כשהם ריקים האתר רץ במצב הדגמה.
   ====================================================================== */
const CONFIG = {
  SUPABASE_URL: "",
  SUPABASE_ANON_KEY: ""
};

const REGIONS = ["צפון","מרכז","ירושלים","דרום","שבעתה"];

const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
const H24 = 24*3600*1000;

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digits = s => String(s || "").replace(/\D/g, "");
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const pad = n => String(n).padStart(2,"0");
const fmtTime = iso => { const d = new Date(iso); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const fmtDM = iso => { const d = new Date(iso); return pad(d.getDate())+"/"+pad(d.getMonth()+1); };
const WD = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
function dayKey(iso){ const d = new Date(iso); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dayLabel(iso){
  const d = new Date(iso), t = new Date(); t.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const diff = Math.round((dd - t)/86400000);
  const base = "יום "+WD[d.getDay()]+" · "+fmtDM(iso);
  if (diff === 0) return "היום · "+base;
  if (diff === 1) return "מחר · "+base;
  if (diff === -1) return "אתמול · "+base;
  return base;
}
const startOfToday = () => { const t = new Date(); t.setHours(0,0,0,0); return t.getTime(); };
function localParts(iso){ const d = new Date(iso); return {date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, time:`${pad(d.getHours())}:${pad(d.getMinutes())}`}; }
const telLink = p => `<a href="tel:${esc(p)}">${esc(p)}</a>`;
function waLink(phone, text){ const d = digits(phone); const intl = d.startsWith("0") ? "972"+d.slice(1) : d; return `https://wa.me/${intl}?text=${encodeURIComponent(text)}`; }
function seatBar(taken, cap){
  const p = Math.min(100, Math.round(taken/cap*100));
  const cls = taken >= cap ? "max" : p >= 80 ? "mid" : "";
  return `<div class="bar ${cls}"><i style="width:${p}%"></i></div>`;
}
const busSvg = (c="#e8a820", s=40) => `<svg width="${s}" height="${s}" viewBox="0 0 48 48" fill="none"><rect x="7" y="6" width="34" height="30" rx="6" fill="${c}"/><rect x="11" y="11" width="26" height="11" rx="2" fill="#2b3524"/><rect x="11" y="26" width="6" height="4" rx="1.5" fill="#2b3524"/><rect x="31" y="26" width="6" height="4" rx="1.5" fill="#2b3524"/><rect x="11" y="35" width="7" height="6" rx="2" fill="${c}"/><rect x="30" y="35" width="7" height="6" rx="2" fill="${c}"/><rect x="21" y="8" width="6" height="2" rx="1" fill="#2b3524" opacity=".5"/></svg>`;

function stopOptions(sh){
  const out = [];
  for (const x of [sh.gather_place, ...(sh.stops||[]), sh.release_place]) { const v = String(x||"").trim(); if (v && !out.includes(v)) out.push(v); }
  return out;
}
const releaseLine = sh => sh.release_place || sh.release_time ? `שחרור${sh.release_time?" "+esc(sh.release_time):""}${sh.release_place?" ב"+esc(sh.release_place):""}` : "";

function stopSort(sh){ const o = stopOptions(sh); return (a,b)=>((o.indexOf(a.stop)+1||99)-(o.indexOf(b.stop)+1||99)) || String(a.created_at).localeCompare(String(b.created_at)); }

/* ---------------- toast / modal ---------------- */
function toast(msg, kind=""){
  const el = document.createElement("div"); el.className = "tst "+kind; el.textContent = (kind==="err" ? "⚠ " : "") + msg;
  if (kind==="err") { const a = $("#srAlert"); a.textContent = ""; setTimeout(()=>{ a.textContent = msg; }, 50); el.setAttribute("aria-hidden","true"); }
  $("#toast").appendChild(el); setTimeout(()=>el.remove(), kind==="err"?6000:3200);
}
let modalCancel = null, modalReturn = null;
const FOCUSABLE = 'button:not([disabled]),[href],input:not([type=hidden]):not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function openModal(html){
  if (!modalOpen()) modalReturn = document.activeElement;
  html = html.replace("<h3>", '<h3 id="mTitle">');
  $("#modalRoot").innerHTML = `<div class="modal-bg" data-act="mbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">${html}</div></div>`;
  const m = $("#modalRoot .modal");
  const f = m.querySelector('input:not([type=hidden]),select,textarea') || m.querySelector(FOCUSABLE) || m;
  setTimeout(()=>f.focus(), 30);
}
function closeModal(){
  $("#modalRoot").innerHTML = "";
  if (modalCancel){ const c = modalCancel; modalCancel = null; c(); }
  if (modalReturn && document.contains(modalReturn)) { try { modalReturn.focus(); } catch(e){} }
  modalReturn = null;
}
const modalOpen = () => !!$("#modalRoot").innerHTML;
document.addEventListener("keydown", e => {
  if (modalOpen()) {
    if (e.key === "Escape") { e.preventDefault(); if (!document.querySelector("#modalRoot [aria-busy=true]")) closeModal(); return; }
    if (e.key === "Tab") {
      const items = [...$("#modalRoot .modal").querySelectorAll(FOCUSABLE)].filter(x=>x.offsetParent!==null);
      if (!items.length) return;
      const first = items[0], last = items[items.length-1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
  const t = e.target;
  if ((e.key === "Enter" || e.key === " ") && t && t.getAttribute && t.getAttribute("role") === "button" && t.tagName !== "BUTTON") { e.preventDefault(); t.click(); }
});
function ask(title, text, ok="אישור", danger=false, pick=null){
  return new Promise(res=>{
    openModal(`<h3>${esc(title)}</h3><div class="muted" style="margin-bottom:18px">${text}</div>
      <div class="row end"><button class="btn ghost" data-act="mclose">ביטול</button><button class="btn ${danger?"danger":"primary"}" id="askOk">${esc(ok)}</button></div>`);
    modalCancel = () => res(false);
    $("#askOk").onclick = () => { let v = true; if (pick) { v = pick(); if (v===false) return; if (v===null) v = true; } modalCancel = null; $("#modalRoot").innerHTML = ""; res(v); };
  });
}

/* ======================================================================
   API — Supabase (אמיתי) או Demo (בדפדפן)
   ====================================================================== */
async function call(fn, args){
  /*DEMO:start*/if (!LIVE) { await new Promise(r=>setTimeout(r,120)); return Demo[fn](JSON.parse(JSON.stringify(args||{}))); }/*DEMO:end*/
  if (!LIVE) throw new Error("האתר לא מוגדר לשרת. פנה למנהל המערכת.");
  const base = CONFIG.SUPABASE_URL.replace(/\/$/,"");
  let r;
  try { r = await fetch(`${base}/rest/v1/rpc/${fn}`, {
    method:"POST",
    headers: Object.assign({ "Content-Type":"application/json", apikey:CONFIG.SUPABASE_ANON_KEY }, CONFIG.SUPABASE_ANON_KEY.startsWith("sb_") ? {} : { Authorization:"Bearer "+CONFIG.SUPABASE_ANON_KEY }),
    body: JSON.stringify(args||{})
  }); } catch(e) { const err = new Error("אין חיבור לשרת. בדוק את החיבור לאינטרנט ונסה שוב."); err.network = true; throw err; }
  const txt = await r.text(); let d = null; try{ d = txt ? JSON.parse(txt) : null; }catch(e){}
  if (!r.ok) {
    const msg = (d && (d.message || d.hint)) || "שגיאת שרת";
    if (/יש להתחבר מחדש/.test(msg) && session) { session = null; data = null; store.del(SKEY); setTimeout(()=>{ render(); toast(msg, "err"); }, 0); }
    throw new Error(msg);
  }
  return d;
}

/* ---------- days ---------- */
function shortDay(iso){
  const d = new Date(iso), t = new Date(); t.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const diff = Math.round((dd - t)/86400000);
  return diff===0 ? "היום" : diff===1 ? "מחר" : diff===-1 ? "אתמול" : WD[d.getDay()];
}
function fullDate(iso){ const d = new Date(iso); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear(); }
function keyDate(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d, 12); }
function longDay(isoOrKey){
  const d = isoOrKey.length===10 ? keyDate(isoOrKey) : new Date(isoOrKey);
  const sd = shortDay(d.toISOString());
  return (sd==="היום"||sd==="מחר"||sd==="אתמול" ? sd+", יום "+WD[d.getDay()] : "יום "+WD[d.getDay()]) + " " + fullDate(d.toISOString());
}
const ST_LABEL = {registered:"שמר מקום", at_pickup:"בנקודת האיסוף", boarded:"עלה לשאטל", no_show:"לא הגיע", arrived:"סומן 'הגיע' (סימון ישן)"};
const freeSeats = sh => Math.max(0, sh.capacity - sh.taken - (sh.reserved||0));
const HOLD_H = () => (data && data.hold_hours) || 3;
const untilText = iso => `${dayLabel(iso)} ${fmtTime(iso)}`;
const queueRulesHTML = () => `<ul class="rules small">
  <li>מקום שמתפנה מוצע לממתינים <b>לפי הסדר</b> — קודם למי שנכנס ראשון. אי אפשר לעקוף את התור.</li>
  <li>כשמגיע תורך, המקום <b>שמור לך ${HOLD_H()} שעות</b> (ולא אחרי שעת היציאה). כדי לקבל אותו צריך להיכנס לאתר ולאשר שמירת מקום.</li>
  <li><b>אין הודעה או התראה אוטומטית.</b> כדי לדעת אם הגיע תורך — היכנס לאתר ובדוק ב"הנסיעות שלי".</li>
  <li>לא שמרת בזמן? המקום עובר לבא בתור. אפשר להצטרף שוב לסוף התור.</li></ul>`;
function dayKeys(list){ return [...new Set(list.map(s=>dayKey(s.depart_at)))]; }
function pickDay(list){
  const keys = dayKeys(list);
  if (!keys.includes(ui.day)) {
    const now = Date.now();
    const nxt = list.find(s=>new Date(s.depart_at).getTime() > now - 3600e3);
    ui.day = nxt ? dayKey(nxt.depart_at) : keys[0];
  }
  return ui.day;
}
function dayChipsHTML(list, sel, markDays){
  return `<div class="days" role="group" aria-label="בחירת יום" id="dayChips">${dayKeys(list).map(k=>{
    const day = list.filter(x=>dayKey(x.depart_at)===k);
    const mine = markDays && markDays.has(k);
    return `<button class="dchip ${k===sel?"on":""}" data-act="day" data-v="${k}" aria-pressed="${k===sel}" aria-label="${longDay(k)}, ${day.length} שאטלים${mine?", יש לך מקום שמור ביום הזה":""}"><span class="dw">${shortDay(day[0].depart_at)}</span><span class="dd">${fullDate(day[0].depart_at)}</span><span class="dn">${day.length} שאטלים</span>${mine?`<span class="dot" aria-hidden="true">●</span>`:""}</button>`;
  }).join("")}</div>`;
}
function bucketOf(iso){ const h = new Date(iso).getHours(); return h < 12 ? 0 : h < 17 ? 1 : 2; }
const BUCKETS = ["☀️ בוקר","🌤️ צהריים","🌙 ערב"];
function bucketed(list, cardFn){
  let h = "";
  for (let b=0;b<3;b++){
    const part = list.filter(s=>bucketOf(s.depart_at)===b);
    if (!part.length) continue;
    h += `<div class="bucket">${BUCKETS[b]} <span class="ct">· ${part.length} שאטלים</span></div>` + part.map(cardFn).join("");
  }
  return h;
}

function attentionItems(up){
  const now = Date.now(), H = 3600e3, items = [];
  const link = (id, label) => `<button class="btn ghost sm" data-act="openShuttle" data-id="${esc(id)}">${label}</button>`;
  const when = s => `${dayLabel(s.depart_at)} ${fmtTime(s.depart_at)} · ${esc(s.gather_place||s.route)} · ${esc(s.region)}`;
  for (const r of REGIONS) if (!data.contacts.some(c=>c.region===r))
    items.push({lv:"urgent", t:`למרחב ${r} אין איש קשר`, d:"חיילים מהמרחב לא יידעו למי לפנות לביטול מאוחר או לשחרור חסימה.", a:`<button class="btn ghost sm" data-act="tab" data-v="staff">להגדרה בצוות</button>`});
  for (const s of up) {

  const region = sh ? sh.region : (me.role==="region" ? me.region : (ui.region!=="all" ? ui.region : ""));
  const cmds = data.staff.filter(s=>s.role==="commander");
  const opts = REGIONS.filter(r=>me.role==="admin"||r===me.region).map(r=>{
    const c = cmds.filter(x=>x.region===r); if (!c.length) return "";
    return `<optgroup label="${r}">${c.map(x=>`<option value="${esc(x.id)}" ${sh&&sh.commander_id===x.id?"selected":""}>${esc(x.full_name)}</option>`).join("")}</optgroup>`;
  }).join("");
  const title = !sh ? "שאטל חדש" : dup ? "שכפול שאטל" : "עריכת שאטל";
  openModal(`<h3>${title}</h3><form data-form="shuttle">
    <input type="hidden" name="id" value="${sh && !dup ? esc(sh.id) : ""}">
    ${me.role==="admin" ? `<label class="f"><span>מרחב</span><select class="in" name="region" required><option value="">בחר…</option>${REGIONS.map(r=>`<option ${region===r?"selected":""}>${r}</option>`).join("")}</select></label>` : `<input type="hidden" name="region" value="${esc(me.region)}">`}
    <div class="grid2">
      <label class="f"><span>תאריך</span><input class="in" type="date" name="date" required value="${d.date}"></label>
      <label class="f"><span>שעת התייצבות</span><input class="in" type="time" name="time" required value="${d.time}"></label>
    </div>
    <label class="f"><span>מקום התייצבות</span><input class="in" name="gather" required placeholder="לדוגמה: בית חיל האוויר הרצליה" value="${esc(sh?.gather_place||"")}"></label>
    <label class="f"><span>מועדות (תחנות בדרך) — כל תחנה בשורה נפרדת</span><textarea class="in" name="stops" placeholder="רכבת הרצליה&#10;רכבת נתניה&#10;מחלף אור עקיבא">${esc((sh?.stops||[]).join("\n"))}</textarea></label>
    <div class="grid2">
      <label class="f"><span>מקום שחרור</span><input class="in" name="release" required placeholder="לדוגמה: מישר" value="${esc(sh?.release_place||"")}"></label>
      <label class="f"><span>שעת שחרור</span><input class="in" type="time" name="release_time" value="${esc(sh?.release_time||"")}"></label>
    </div>
    <div class="grid2">
      <label class="f"><span>מקומות באוטובוס</span><input class="in" type="number" min="1" max="80" name="capacity" required value="${sh?.capacity||55}"></label>
      <label class="f"><span>מפקד נסיעה</span><select class="in" name="commander"><option value="">טרם שובץ</option>${opts}</select></label>
    </div>
    <label class="f"><span>הערות (לא חובה)</span><input class="in" name="notes" placeholder="לדוגמה: להגיע 10 דקות לפני" value="${esc(sh?.notes||"")}"></label>
    <div class="row end"><button type="button" class="btn ghost" data-act="mclose">ביטול</button><button class="btn primary" type="submit">שמירה</button></div>
  </form>`);
}
function staffForm(st){
  const me = data.me;
  openModal(`<h3>${st ? "עריכת איש צוות" : (me.role==="admin" ? "איש צוות חדש" : "מפקד נסיעה חדש")}</h3><form data-form="staff">
    <input type="hidden" name="id" value="${esc(st?.id||"")}">
    <label class="f"><span>שם מלא</span><input class="in" name="name" required value="${esc(st?.full_name||"")}"></label>
    <label class="f"><span>טלפון (משמש לכניסה)</span><input class="in" name="phone" inputmode="tel" dir="ltr" required value="${esc(st?.phone||"")}"></label>
    ${me.role==="admin" ? `<div class="grid2">
      <label class="f"><span>תפקיד</span><select class="in" name="role" required>${Object.entries(ROLE_LABEL).map(([k,l])=>`<option value="${k}" ${(st?.role||"commander")===k?"selected":""}>${l}</option>`).join("")}</select></label>
      <label class="f"><span>מרחב</span><select class="in" name="region"><option value="">— (למנהל)</option>${REGIONS.map(r=>`<option ${st?.region===r?"selected":""}>${r}</option>`).join("")}</select></label>
    </div>` : `<input type="hidden" name="role" value="commander"><input type="hidden" name="region" value="${esc(me.region)}">`}
    <label class="f"><span>${st ? "קוד כניסה חדש (השאר ריק כדי לא לשנות)" : "קוד כניסה (4 ספרות לפחות)"}</span><input class="in" name="pin" dir="ltr" ${st?"":"required"} minlength="4" autocomplete="new-password"></label>
    <div class="row end"><button type="button" class="btn ghost" data-act="mclose">ביטול</button><button class="btn primary" type="submit">שמירה</button></div>
  </form>`);
}

const findSh = id => data.shuttles.find(s=>s.id===id);

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a==="mbg") { if (e.target===el) closeModal(); return; }
  try {
    switch (a) {
      case "mclose": closeModal(); break;
      case "ltab": ui.loginTab = el.dataset.v; ui.signup = null; render(); break;
      case "pickRegion": ui.pickRegion = el.dataset.v; store.set("s820_region", ui.pickRegion); render(); break;
      case "unpickRegion": ui.pickRegion = null; ui.signup = null; render(); break;
      case "day": ui.day = el.dataset.v; render(); break;
      case "changeRegion": openModal(`<h3>החלפת מרחב</h3><div class="small muted">תראה את השאטלים של המרחב שתבחר</div>${regionTiles("setRegion", data.soldier.region)}<div class="row end" style="margin-top:14px"><button class="btn ghost" data-act="mclose">ביטול</button></div>`); break;
      case "setRegion": {
        const r = el.dataset.v; closeModal();
        if (r !== data.soldier.region) { await call("soldier_set_region", {...cred(), p_region:r}); ui.pickRegion = r; store.set("s820_region", r); ui.day = null; await reload(); toast("עברת למרחב "+r); }
        break;
      }
      case "copyDay": {
        const lines = ["שעה\tמסלול\tשם\tטלפון\tתחנה\tסטטוס"];
        for (const s of lastSideList) for (const p of s.passengers.slice().sort(stopSort(s)))
          lines.push([fmtTime(s.depart_at), s.route, p.first_name+" "+p.last_name, p.phone, p.stop||"", ST_LABEL[p.status]||p.status].join("\t"));
        const txt = lines.join("\n");
        try { await navigator.clipboard.writeText(txt); toast("הטבלה הועתקה — אפשר להדביק באקסל"); }
        catch(err){ openModal(`<h3>טבלת נרשמים</h3><textarea class="in" style="min-height:260px" readonly>${esc(txt)}</textarea><div class="row end" style="margin-top:10px"><button class="btn ghost" data-act="mclose">סגירה</button></div>`); }
        break;
      }
      case "unsignup": ui.signup = null; render(); break;
      /*DEMO:start*/case "demo": { const d = DEMO_LOGINS[el.dataset.v]; const r = d.type==="soldier" ? await call("soldier_signin", {p_tz:d.tz, p_phone:d.phone}) : await call("staff_signin", {p_phone:d.phone, p_pin:d.pin}); await startSession({type:d.type, token:signinResult(r)}); break; }
      case "demoReset": Demo.reset(); toast("נתוני ההדגמה אופסו"); break;/*DEMO:end*/
      case "logout": logout(); break;
      case "refresh": await reload(); toast("עודכן"); break;
      case "tab": ui.tab = el.dataset.v; render(); window.scrollTo(0,0); break;
      case "attnAll": ui.attnAll = !ui.attnAll; render(); break;
      case "past": ui.past = el.dataset.v==="1"; render(); break;
      case "toggle": {
        const cur = data.me.role==="commander" ? ui.open[id]!==false : !!ui.open[id];
        ui.open[id] = !cur; render(); break;
      }
      case "openShuttle": {
        const s = findSh(id); ui.tab = "shuttles"; ui.region = s.region; ui.past = false; ui.day = dayKey(s.depart_at); ui.open[id] = true; render();
        setTimeout(()=>{ const n = document.getElementById("sh-"+id); n && n.scrollIntoView({behavior:"smooth",block:"start"}); }, 30);
        break;
      }
      case "register": openReserve(id); break;
      case "waitJoin": { const sh = data.shuttles.find(x=>x.id===id); ui.pending = sh; ui.wstate = {step:"choose"}; openModal(waitDialog(sh, ui.wstate)); break; }
      case "waitLeave": {
        const ok = await ask("יציאה מרשימת ההמתנה", "לצאת מרשימת ההמתנה לשאטל הזה? המקום שלך בתור יאבד.", "כן, לצאת", true); if (!ok) return;
        await call("soldier_wait_leave", {...cred(), p_shuttle_id:id}); await reload(); toast("יצאת מרשימת ההמתנה"); break;
      }
      case "goMine": closeModal(); ui.sview = "mine"; render(); window.scrollTo(0,0); break;
      case "sview": ui.sview = el.dataset.v; render(); window.scrollTo(0,0); break;
      case "focusDays": { const d = document.querySelector("#dayChips .dchip.on") || document.querySelector("#dayChips .dchip"); d && d.focus(); break; }
      case "hxGo": { const c = document.getElementById("entry"); if (!c) break; c.scrollIntoView({block:"start"}); const f = c.querySelector(".rtile, input, button"); f && f.focus({preventScroll:true}); break; }
      case "cancel": {
        const ok = await ask("ביטול שמירת מקום", "לבטל את שמירת המקום? המקום יתפנה לחייל אחר.", "כן, לבטל", true); if (!ok) return;
        await call("soldier_cancel", {...cred(), p_reg_id:id}); await reload(); toast("שמירת המקום בוטלה"); break;
      }
      case "editAppeal": {
        openModal(`<h3>עריכת ההסבר</h3>${appealForm(data.soldier.appeal||"")}`); break;
      }
      case "mark": {
        const st = el.dataset.cur===el.dataset.st ? "registered" : el.dataset.st;
        await call("staff_mark", {...cred(), p_reg_id:el.dataset.reg, p_status:st}); await reload();
        toast(st==="no_show" ? "סומן: לא הגיע — הנוסע נחסם להרשמה" : "סומן: " + (ST_LABEL[st]||st));
        break;
      }
      case "removeReg": {
        const ok = await ask("הסרה מהשאטל", `להסיר את <b>${esc(el.dataset.name)}</b> מרשימת השאטל?`, "הסרה", true); if (!ok) return;
        await call("staff_remove_reg", {...cred(), p_reg_id:el.dataset.reg}); await reload(); toast("הוסר מהשאטל"); break;
      }
      case "newShuttle": shuttleForm(null,false); break;
      case "editShuttle": shuttleForm(findSh(id),false); break;
      case "dupShuttle": shuttleForm(findSh(id),true); break;
      case "delShuttle": {
        const s = findSh(id);
        const ok = await ask("מחיקת שאטל", `למחוק את <b>${esc(s.route)}</b> (${dayLabel(s.depart_at)} ${fmtTime(s.depart_at)})?${s.taken?`<br><b style="color:var(--red)">${s.taken} חיילים רשומים לשאטל הזה.</b>`:""}`, "מחיקה", true);
        if (!ok) return;
        await call("staff_delete_shuttle", {...cred(), p_id:id}); await reload(); toast("השאטל נמחק"); break;
      }
      case "copyList": {
        const s = findSh(id);
        let lastSt = null;
        const txt = `🚌 ${s.route} · ${dayLabel(s.depart_at)}\nהתייצבות ${fmtTime(s.depart_at)}${s.gather_place?" ב"+s.gather_place:""}${s.release_time||s.release_place?` · שחרור ${s.release_time||""} ${s.release_place?"ב"+s.release_place:""}`:""}\nמפקד נסיעה: ${s.commander_name||"—"}\nרשומים: ${s.taken}/${s.capacity}\n` + s.passengers.slice().sort(stopSort(s)).map((p,i)=>{ let hd=""; if (p.stop!==lastSt){ lastSt=p.stop; hd=`\n📍 ${p.stop||"ללא תחנה"}\n`; } return hd+`${i+1}. ${p.first_name} ${p.last_name} · ${p.phone}${p.status==="arrived"?" ✓":p.status==="no_show"?" ✗":""}`; }).join("\n");
        try { await navigator.clipboard.writeText(txt); toast("הרשימה הועתקה — אפשר להדביק בוואטסאפ"); }
        catch(err){ openModal(`<h3>רשימת נוסעים</h3><textarea class="in" style="min-height:260px" readonly>${esc(txt)}</textarea><div class="row end" style="margin-top:10px"><button class="btn ghost" data-act="mclose">סגירה</button></div>`); }
        break;
      }
      case "release": {
        const ok = await ask("שחרור חסימה", `לשחרר את <b>${esc(el.dataset.name)}</b>? החייל יוכל שוב להירשם לשאטלים.`, "שחרור"); if (!ok) return;
        await call("staff_release", {...cred(), p_tz:el.dataset.tz}); await reload(); toast("החסימה שוחררה ✓"); break;
      }
      case "newStaff": staffForm(null); break;
      case "editStaff": staffForm(data.staff.find(s=>s.id===id)); break;
      case "delStaff": {
        const s = data.staff.find(x=>x.id===id);
        const ok = await ask("מחיקת איש צוות", `למחוק את <b>${esc(s.full_name)}</b> (${ROLE_LABEL[s.role]})?`, "מחיקה", true); if (!ok) return;
        await call("staff_delete_staff", {...cred(), p_id:id}); await reload(); toast("נמחק"); break;
      }
    }
  } catch(err) { toast(err.message || "שגיאה", "err"); }
});

document.addEventListener("change", e => {
  const el = e.target.closest("[data-change]"); if (!el) return;
  if (el.dataset.change==="region") { ui.region = el.value; ui.day = null; render(); }
  if (el.dataset.change==="sideShuttle") { ui.sideShuttle = el.value; render(); const n = document.querySelector('[data-change="sideShuttle"]'); n && n.focus(); }
});

function fieldErr(form, name, msg){
  const f = form.querySelector(`[name="${name}"]`); if (!f) return;
  const id = "err-"+form.dataset.form+"-"+name;
  f.setAttribute("aria-invalid","true"); f.setAttribute("aria-describedby", id);
  let d = document.getElementById(id); if (!d) { d = document.createElement("div"); d.id = id; d.className = "ferr"; f.insertAdjacentElement("afterend", d); }
  d.textContent = "⚠ " + msg;
}
function clearErrs(form){
  form.querySelectorAll(".ferr").forEach(x=>x.remove());
  form.querySelectorAll("[aria-invalid]").forEach(x=>{ x.removeAttribute("aria-invalid"); x.removeAttribute("aria-describedby"); });
  form.querySelectorAll(".formerr").forEach(x=>x.remove());
}
class FieldError extends Error { constructor(map){ super("יש לתקן את השדות המסומנים"); this.map = map; } }
const FORMS = {
  async reserve(f, form){ await submitReserve(form); },
  async waitJoin(f, form){ await submitWait(form); },
  async soldierLogin(f){
    const tz = digits(f.tz), phone = digits(f.phone); const errs = {};
    if (tz.length<5 || tz.length>9) errs.tz = 'תעודת זהות צריכה להכיל 5 עד 9 ספרות';
    if (phone.length!==10 || !phone.startsWith("05")) errs.phone = "מספר טלפון נייד: 10 ספרות שמתחילות ב-05";
    if (Object.keys(errs).length) throw new FieldError(errs);
    const r = await call("soldier_signin", {p_tz:tz, p_phone:phone});
    if (!r.ok && r.code==="no_match") { ui.signup = {tz, phone, note:r.message}; render(); return; }
    await startSession({type:"soldier", token:signinResult(r)});
    if (ui.pickRegion && data.soldier.region !== ui.pickRegion) {
      await call("soldier_set_region", {...cred(), p_region: ui.pickRegion}); await reload(); toast("המרחב שלך עודכן ל"+ui.pickRegion);
    }
  },
  async signup(f){
    const errs = {}; if (!String(f.first||"").trim()) errs.first = "יש למלא שם פרטי"; if (!String(f.last||"").trim()) errs.last = "יש למלא שם משפחה";
    if (Object.keys(errs).length) throw new FieldError(errs);
    const r = await call("soldier_create", {p_tz:ui.signup.tz, p_first_name:f.first, p_last_name:f.last, p_phone:ui.signup.phone, p_region:ui.pickRegion});
    const s = {type:"soldier", token:signinResult(r)}; ui.signup = null;
    await startSession(s); toast("נרשמת למערכת ✓");
  },
  async staffLogin(f){
    const phone = digits(f.phone);
    if (phone.length!==10) throw new FieldError({phone:"מספר טלפון: 10 ספרות"});
    if (!f.pin) throw new FieldError({pin:"יש להזין קוד כניסה"});
    const r = await call("staff_signin", {p_phone:phone, p_pin:f.pin});
    await startSession({type:"staff", token:signinResult(r)});
  },
  async appeal(f){
    await call("soldier_appeal", {...cred(), p_text:f.text}); if (modalOpen()) closeModal(); await reload(); toast("ההסבר נשלח לאיש הקשר");
  },
  async shuttle(f){
    const dt = new Date(`${f.date}T${f.time}`);
    if (isNaN(dt)) throw new Error("תאריך או שעה לא תקינים");
    const stops = String(f.stops||"").split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);
    await call("staff_save_shuttle", {...cred(), p_id:f.id||null, p_region:f.region, p_route:`${f.gather.trim()} ← ${f.release.trim()}`, p_depart_at:dt.toISOString(), p_capacity:+f.capacity||55, p_commander_id:f.commander||null, p_notes:f.notes||"", p_gather_place:f.gather, p_stops:stops, p_release_place:f.release, p_release_time:f.release_time||""});
    closeModal(); await reload(); toast("השאטל נשמר ✓");
  },
  async staff(f){
    await call("staff_save_staff", {...cred(), p_id:f.id||null, p_full_name:f.name, p_new_phone:f.phone, p_new_pin:f.pin||null, p_role:f.role, p_region:f.region||null});
    // if I changed my own phone/pin — update session
    // קוד חדש לעצמי: השרת מנתק את החיבורים הקיימים, אז מתחברים מחדש עם הקוד החדש
    if (f.id && f.id===data.me.id && f.pin) { session.token = signinResult(await call("staff_signin", {p_phone:digits(f.phone), p_pin:f.pin})); store.set(SKEY, session); }
    closeModal(); await reload(); toast("נשמר ✓");
  }
};
document.addEventListener("submit", async e => {
  const form = e.target.closest("form[data-form]"); if (!form) return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(form).entries());
  const btn = form.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
  if (form.dataset.form !== "reserve" && form.dataset.form !== "waitJoin") clearErrs(form);
  try { await FORMS[form.dataset.form](f, form); }
  catch(err) {
    if (!form.isConnected) { toast(err.message || "שגיאה", "err"); }
    else if (err.map) { for (const [k,v] of Object.entries(err.map)) fieldErr(form, k, v); const first = form.querySelector("[aria-invalid=true]"); first && first.focus(); const a = $("#srAlert"); a.textContent = ""; setTimeout(()=>{ a.textContent = Object.values(err.map).join(". "); }, 50); }
    else { const box = document.createElement("div"); box.className = "formerr"; box.setAttribute("role","alert"); box.tabIndex = -1; box.textContent = "⚠ " + (err.message || "שגיאה"); form.prepend(box); box.focus(); }
  }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});

/* auto refresh for staff every 30s */
setInterval(async () => {
  if (!session || !data || modalOpen() || document.visibilityState!=="visible") return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  try { await load(); render(); } catch(e){ render(); }
}, 30000);

/* boot */
(async () => {
  if (session) { try { await load(); } catch(e){ session = null; store.del(SKEY); } }
  render();
})();
