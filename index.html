<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b3524">
<title>מערך שאטלים 820</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3ee; --card:#fff; --ink:#1b211a; --muted:#5d6659; --line:#e1e4da; --soft:#f7f8f4;
  --olive:#2b3524; --olive2:#3e4c33; --amber:#e8a820; --amber-soft:#fdf3dc;
  --green:#2c8547; --green-soft:#e5f3e9; --red:#c43a2d; --red-soft:#fbe9e7; --blue:#2a5ea6; --blue-soft:#e6eefa;
  --r:14px; --shadow:0 1px 2px rgba(20,30,15,.06),0 4px 14px rgba(20,30,15,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{overflow-wrap:break-word}
body{font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.hide{display:none!important}

/* top bar */
.top{background:var(--olive);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;white-space:nowrap}
.logo .n{background:var(--amber);color:var(--olive);border-radius:7px;padding:1px 7px;font-weight:900;letter-spacing:.5px}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.who .role{opacity:.75}
.iconbtn{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:9px;padding:7px 10px;cursor:pointer;font-size:13px}
.iconbtn:hover{background:rgba(255,255,255,.2)}
.demo-ribbon{background:var(--amber);color:var(--olive);text-align:center;font-size:12.5px;font-weight:700;padding:5px 10px}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.narrow{max-width:640px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.badge{background:var(--red);color:#fff;border-radius:999px;font-size:11.5px;padding:0 7px;line-height:19px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.end{justify-content:flex-end}
.between{justify-content:space-between}
.grow{flex:1}
h1,h2,h3{margin:0;line-height:1.2}
.section-title{font-size:13px;font-weight:700;color:var(--muted);margin:22px 2px 10px;letter-spacing:.2px}

/* buttons */
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:filter .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--olive);color:#fff}
.btn.primary:hover{filter:brightness(1.15)}
.btn.amber{background:var(--amber);color:var(--olive)}
.btn.ghost{background:var(--soft);border:1px solid var(--line)}
.btn.ghost:hover{background:#eef0e8}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.lnk{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-weight:600}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.region{background:var(--olive2);color:#fff}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.wait{background:#eef0ea;color:var(--muted)}
.chip.full{background:var(--red);color:#fff}
.chip.info{background:var(--blue-soft);color:var(--blue)}
.chip.warn{background:var(--amber-soft);color:#94680a}

/* forms */
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.in{width:100%;border:1px solid #cfd4c6;background:#fff;border-radius:10px;padding:11px 12px;outline:none}
input[dir=ltr].in{text-align:right}
.in:focus{border-color:var(--olive2);box-shadow:0 0 0 3px rgba(62,76,51,.15)}
textarea.in{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

/* login */
.login-wrap{max-width:440px;margin:0 auto;padding:34px 16px 60px}
.brand{text-align:center;margin-bottom:22px}
.brand .busic{width:74px;height:74px;margin:0 auto 12px;background:var(--olive);border-radius:20px;display:grid;place-items:center;box-shadow:var(--shadow)}
.brand h1{font-size:28px;font-weight:900}
.brand h1 b{color:var(--olive2);background:var(--amber);padding:0 8px;border-radius:8px}
.brand p{color:var(--muted);margin:8px 0 0}
.login{padding:18px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.demo-box{margin-top:16px;padding:14px;border:1px dashed #c9b27a;background:#fffaf0;border-radius:var(--r)}
.demo-box h4{margin:0 0 8px;font-size:14px}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}

/* soldier */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.hello h2{font-size:23px;font-weight:800}
.rules{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.day{font-size:14px;font-weight:800;margin:20px 2px 9px;color:var(--olive2)}
.sc{padding:14px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start}
.sc.mine{border-color:var(--olive2);box-shadow:0 0 0 2px rgba(62,76,51,.18),var(--shadow)}
.tbig{font-size:26px;font-weight:900;letter-spacing:.5px;line-height:1;padding-top:2px;font-variant-numeric:tabular-nums}
.route{font-weight:800;font-size:16px}
.meta{font-size:13px;color:var(--muted)}
.sc .foot{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.bar{height:7px;background:#e9ece4;border-radius:9px;overflow:hidden;min-width:90px;flex:1}
.bar i{display:block;height:100%;border-radius:9px;background:var(--green)}
.bar.mid i{background:var(--amber)} .bar.max i{background:var(--red)}
.seatsn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.alert{border-radius:var(--r);padding:16px;margin-bottom:14px}
.alert.red{background:var(--red-soft);border:1px solid #f0c3bd}
.alert h3{font-size:17px;color:var(--red);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.alert p{margin:6px 0}
.empty{text-align:center;color:var(--muted);padding:36px 16px}
.stops{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
.stp{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:600}
.stopchip{background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:0 7px;font-size:12px;font-weight:700;margin-inline-start:4px}
.stopgrp{font-size:12.5px;font-weight:800;color:var(--olive2);padding:10px 4px 2px}

/* staff */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:6px}
.stat{padding:14px}
.stat .v{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600}
.stat.red .v{color:var(--red)}
.regions{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.regbox{padding:14px}
.reghead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.reghead h3{font-size:17px;font-weight:800}
.mini{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--soft);display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.mini:hover{border-color:#b9c0ad;background:#fff}
.mini.isfull{background:#fff6f5;border-color:#efc6c1}
.mini .tm{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.mini .sub{grid-column:2/4;font-size:12.5px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar select{width:auto;padding:8px 10px}
.shc{margin-bottom:10px;overflow:hidden}
.shc-h{display:grid;grid-template-columns:auto 1fr minmax(150px,220px);gap:4px 14px;align-items:center;padding:13px 14px;cursor:pointer}
.shc-h:hover{background:var(--soft)}
.seatbox{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.seatbox .row{justify-content:space-between}
.shc-b{border-top:1px solid var(--line);padding:12px 14px;background:#fcfcfa}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pl{list-style:none;margin:0;padding:0}
.pr{display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;align-items:center;padding:9px 4px;border-bottom:1px solid #eef0ea}
.pr:last-child{border-bottom:0}
.pr .idx{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:center}
.pr .nm{font-weight:700}
.pr .ph{font-size:12.5px;color:var(--muted)}
.pr .acts{display:flex;gap:5px;align-items:center}
.mk{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.mk.y.on{background:var(--green);border-color:var(--green);color:#fff}
.mk.n.on{background:var(--red);border-color:var(--red);color:#fff}
.mk.x{color:var(--muted)}
.pr.ns{background:#fff5f4}
.blk{padding:14px;margin-bottom:10px}
.appeal{background:var(--soft);border-right:3px solid var(--amber);padding:8px 10px;border-radius:8px;margin:8px 0;font-size:14px}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
table.t th{font-size:12.5px;color:var(--muted);font-weight:700;background:var(--soft)}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,12,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{font-size:19px;margin-bottom:12px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:var(--olive);color:#fff;padding:10px 16px;border-radius:11px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;animation:pop .2s ease}
.tst.err{background:var(--red)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}


/* hero */
.hero{position:relative;height:300px;overflow:hidden;background:linear-gradient(180deg,#2b3524 0%,#3e4c33 55%,#56683f 100%);color:#fff}
.hero .sun{position:absolute;top:34px;left:12%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,#ffd66b 0%,#e8a820 60%,rgba(232,168,32,0) 72%);opacity:.9}
.hero .cloud{position:absolute;height:22px;border-radius:20px;background:rgba(255,255,255,.14);animation:cloud 38s linear infinite}
.hero .cloud::before,.hero .cloud::after{content:"";position:absolute;bottom:6px;border-radius:50%;background:inherit}
.hero .cloud::before{width:34px;height:34px;left:14px}.hero .cloud::after{width:26px;height:26px;left:40px}
.hero .c1{top:60px;width:110px;animation-duration:42s}.hero .c2{top:110px;width:80px;animation-duration:30s;animation-delay:-14s}
@keyframes cloud{from{left:110%}to{left:-160px}}
.hero .hills{position:absolute;left:0;right:0;bottom:46px;height:90px;background:
  radial-gradient(120px 70px at 15% 100%,#4a5b38 98%,transparent 100%),
  radial-gradient(180px 90px at 45% 100%,#435335 98%,transparent 100%),
  radial-gradient(150px 80px at 80% 100%,#4a5b38 98%,transparent 100%)}
.hero .road{position:absolute;left:0;right:0;bottom:0;height:48px;background:#262b24;border-top:4px solid #3a4136}
.hero .road .dash{position:absolute;top:21px;left:0;width:200%;height:4px;background:repeating-linear-gradient(90deg,#e8a820 0 34px,transparent 34px 70px);animation:dash 1.1s linear infinite}
@keyframes dash{from{transform:translateX(0)}to{transform:translateX(-70px)}}
.hero .busrun{position:absolute;bottom:22px;left:110%;animation:drive 11s linear infinite}
.hero .busrun svg{display:block;animation:bob .45s ease-in-out infinite alternate}
.hero .wheel{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}
@keyframes drive{from{left:105%}to{left:-300px}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes spin{to{transform:rotate(-360deg)}}
.hero-txt{position:absolute;top:0;right:0;left:0;text-align:center;padding:28px 16px 0}
.hero-logo{display:inline-flex;gap:8px;align-items:center;font-weight:800;font-size:14px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 12px}
.hero-logo b{background:var(--amber);color:var(--olive);border-radius:6px;padding:0 6px}
.hero h1{font-size:34px;font-weight:900;margin-top:14px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.hero p{margin:6px 0 0;font-size:17px;opacity:.92}
.login-card{max-width:460px;margin:-26px auto 0;position:relative;z-index:2;padding:20px}
.step-t{font-size:19px;font-weight:800;margin-bottom:4px}
.rtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rtile{border:1.5px solid var(--line);background:var(--soft);border-radius:14px;padding:16px 10px;cursor:pointer;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s}
.rtile:hover{border-color:var(--olive2);background:#fff;transform:translateY(-1px);box-shadow:var(--shadow)}
.rtile .ri{font-size:24px}
.rtile.on{border-color:var(--olive);background:var(--olive);color:#fff}
.rtiles .rtile:last-child:nth-child(odd){grid-column:1/-1}
.picked{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:14px}
.staff-link{text-align:center;margin-top:16px}
/* day chips */
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:4px -2px 6px;scrollbar-width:thin}
.dchip{flex:0 0 auto;min-width:74px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.dchip .dw{font-weight:800;font-size:14px}.dchip .dd{font-size:12px;color:var(--muted)}
.dchip .dn{font-size:11px;color:var(--muted);margin-top:2px}
.dchip.on{background:var(--olive);border-color:var(--olive);color:#fff}.dchip.on .dd,.dchip.on .dn{color:rgba(255,255,255,.8)}
.dchip .dot{position:absolute;top:3px;left:7px;font-size:11px;line-height:1;color:var(--amber)}
.bucket{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--olive2);margin:16px 2px 8px}
.bucket .ct{font-weight:600;color:var(--muted);font-size:12.5px}
.mine-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.mine-it{flex:0 0 auto;background:var(--amber-soft);border:1px solid #f0d58f;border-radius:12px;padding:7px 11px;cursor:pointer;font-size:13px}
.mine-it b{font-size:14px}
.regchip{cursor:pointer;border:0}
/* split layout + side table */
.split{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;align-items:start}
.side{position:sticky;top:66px;max-height:calc(100vh - 84px);overflow:auto;padding:0}
.side-h{position:sticky;top:0;background:var(--card);padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;z-index:1}
.side-h h3{font-size:15px;font-weight:800}
table.reg{width:100%;border-collapse:collapse;font-size:13px}
table.reg th{position:sticky;top:51px;background:var(--soft);text-align:right;padding:7px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
table.reg td{padding:7px 8px;border-bottom:1px solid #eef0ea;vertical-align:top}
table.reg tr.grp td{background:#f4f6ef;font-weight:800;color:var(--olive2);font-size:12.5px}
table.reg td.st-ok{color:var(--green);font-weight:800}table.reg td.st-bad{color:var(--red);font-weight:800}
@media (max-width:1000px){.split{grid-template-columns:1fr}.side{position:static;max-height:none}}

/* ===== v5: accessibility, steps, cards ===== */
.skip:focus{position:fixed!important;top:8px;right:8px;width:auto!important;height:auto!important;clip:auto!important;margin:0!important;background:#fff;color:#1f4f8f;padding:8px 12px!important;z-index:100;border-radius:8px;font-weight:800}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid #1a5fb4!important;outline-offset:2px}
.h2{font-size:23px;font-weight:800;margin:0}.h3{font-size:16px;font-weight:800;margin:0}
.steps{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;padding:0;margin:4px 0 6px}
.steps li{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 8px;min-width:0;flex-wrap:wrap}
.steps .sn{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12.5px;background:#e4e7de;color:var(--ink)}
.steps li.done .sn{background:#2c6e3f;color:#fff}
.steps li.cur{border-color:var(--olive);box-shadow:0 0 0 2px rgba(43,53,36,.18)}
.steps li.cur .sn{background:var(--olive);color:#fff}
.steps .st{display:flex;flex-direction:column;min-width:0;flex:1}
.steps .sl{font-size:12px;color:#565f52}
.steps .sv{font-size:12.5px;overflow-wrap:normal;word-break:keep-all}
.sview{margin:6px 0 12px}
.sc2{padding:14px;margin-bottom:10px}
.sc2.mine{border-color:#2c6e3f;box-shadow:0 0 0 2px rgba(44,110,63,.2),var(--shadow)}
.sc2-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.sc2-main .route{font-size:17px;overflow-wrap:anywhere}
.board{font-size:14px;margin-top:4px}
.seats{font-size:13px;background:var(--green-soft);color:#1b5e30;border-radius:10px;padding:4px 9px;text-align:center;line-height:1.25}
.seats b{font-size:17px;display:block}
.seats.low{background:var(--amber-soft);color:#6b4a06}
.seats.full{background:var(--red-soft);color:#8f251c;font-weight:700}
.sc2-act{margin-top:12px}
.sc2-act > .btn{width:100%;padding:12px;font-size:16px}
.mine-box{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--green-soft);border-radius:10px;padding:10px 12px}
.mystat{font-weight:800}.mystat.ok{color:#1b5e30}.mystat.bad{color:#8f251c}
details.more{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-size:14px;font-weight:700;color:#1f4f8f;padding:4px 0}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:14px}
.dl dt{color:#565f52}.dl dd{margin:0;overflow-wrap:anywhere}
.dl.sum{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px}

  const d = new Date(iso), t = new Date(); t.setHours(0,0,0,0);

  const diff = Math.round((dd - t)/86400000);
  const base = "יום "+WD[d.getDay()]+" · "+fmtDM(iso);
  if (diff === 0) return "היום · "+base;
  if (diff === 1) return "מחר · "+base;
  if (diff === -1) return "אתמול · "+base;

/* ---------------- toast / modal ---------------- */
function toast(msg, kind=""){
  const el = document.createElement("div"); el.className = "tst "+kind; el.textContent = (kind==="err" ? "⚠ " : "") + msg;
  if (kind==="err") { const a = $("#srAlert"); a.textContent = ""; setTimeout(()=>{ a.textContent = msg; }, 50); el.setAttribute("aria-hidden","true"); }
  $("#toast").appendChild(el); setTimeout(()=>el.remove(), kind==="err"?6000:3200);

let modalCancel = null, modalReturn = null;
const FOCUSABLE = 'button:not([disabled]),[href],input:not([type=hidden]):not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function openModal(html){
  if (!modalOpen()) modalReturn = document.activeElement;
  html = html.replace("<h3>", '<h3 id="mTitle">');
  $("#modalRoot").innerHTML = `<div class="modal-bg" data-act="mbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">${html}</div></div>`;
  const m = $("#modalRoot .modal");
  const f = m.querySelector('input:not([type=hidden]),select,textarea') || m.querySelector(FOCUSABLE) || m;
  setTimeout(()=>f.focus(), 30);
}
function closeModal(){
  $("#modalRoot").innerHTML = "";
  if (modalCancel){ const c = modalCancel; modalCancel = null; c(); }
  if (modalReturn && document.contains(modalReturn)) { try { modalReturn.focus(); } catch(e){} }
  modalReturn = null;

const modalOpen = () => !!$("#modalRoot").innerHTML;
document.addEventListener("keydown", e => {
  if (modalOpen()) {
    if (e.key === "Escape") { e.preventDefault(); if (!document.querySelector("#modalRoot [aria-busy=true]")) closeModal(); return; }
    if (e.key === "Tab") {
      const items = [...$("#modalRoot .modal").querySelectorAll(FOCUSABLE)].filter(x=>x.offsetParent!==null);
      if (!items.length) return;
      const first = items[0], last = items[items.length-1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
  const t = e.target;
  if ((e.key === "Enter" || e.key === " ") && t && t.getAttribute && t.getAttribute("role") === "button" && t.tagName !== "BUTTON") { e.preventDefault(); t.click(); }
});

async function call(fn, args){
  if (!LIVE) { await new Promise(r=>setTimeout(r,120)); return Demo[fn](JSON.parse(JSON.stringify(args||{}))); }
  const base = CONFIG.SUPABASE_URL.replace(/\/$/,"");
  let r;
  try { r = await fetch(`${base}/rest/v1/rpc/${fn}`, {
    method:"POST",
    headers: Object.assign({ "Content-Type":"application/json", apikey:CONFIG.SUPABASE_ANON_KEY }, CONFIG.SUPABASE_ANON_KEY.startsWith("sb_") ? {} : { Authorization:"Bearer "+CONFIG.SUPABASE_ANON_KEY }),
    body: JSON.stringify(args||{})
  }); } catch(e) { const err = new Error("אין חיבור לשרת. בדוק את החיבור לאינטרנט ונסה שוב."); err.network = true; throw err; }
  const txt = await r.text(); let d = null; try{ d = txt ? JSON.parse(txt) : null; }catch(e){}
  if (!r.ok) throw new Error((d && (d.message || d.hint)) || "שגיאת שרת");
  return d;
}

    const add = (sh, list, status="registered") => { const shx = shuttles.find(x=>x.id===sh); const opts = stopOptions(shx); list.forEach((s,i)=>regs.push({id:uid(),shuttle_id:sh,tz:s.tz,status,resolved:false,stop:opts.length?opts[i%opts.length]:null,created_at:new Date(Date.now()-(list.length-i)*600e3).toISOString()})); };
    const mz = byReg("מרכז");
    add("s1", mz.slice(0,55));
    add("s2", mz.slice(10,42));
    add("s3", mz.slice(20,51));
    add("s8", mz.slice(2,20));
    const nz = byReg("צפון");
    add("n1", nz.slice(0,41)); add("n2", nz.slice(5,33)); add("n3", nz.slice(0,17)); add("n4", nz.slice(20,55));
    add("s5", byReg("ירושלים").slice(0,19));
    add("s6", byReg("דרום").slice(0,11));
    // demo soldier: registered to s3 (cancellable) and s8 (<24h)
    add("s3", [soldiers[0]]); add("s8", [soldiers[0]]);
    // yesterday: arrived + 2 no-shows
    add("s7", mz.slice(4,22), "boarded"); add("s7", mz.slice(22,24), "at_pickup");
    add("s7", [soldiers[1], mz[60]], "no_show");
    const S0 = {staff, soldiers, shuttles, registrations:regs};
    const note = `נרשמת לשאטל "ת"א מרכז ← בסיס" ב-${fmtDM(at(-1,6,15))} 06:15 ולא הגעת.`;
    for (const s of [soldiers[1], mz[60]]) { s.blocked = true; s.block_note = note; }
    mz[60].appeal = "היה לי גימלים מהרופא ושכחתי לבטל, מצטער. מצרף אישור.";
    return S0;
  }
  function load(){ S = store.get(KEY); if (!S || !S.staff) { S = seed(); save(); } }
  function save(){ store.set(KEY, S); }
  load();

  const active = r => r.status !== "cancelled";
  const takenOf = id => S.registrations.filter(r=>r.shuttle_id===id && active(r)).length;
  const staffById = id => S.staff.find(s=>s.id===id);
  const byDep = (a,b) => new Date(a.depart_at) - new Date(b.depart_at);
  const pub = s => ({id:s.id, full_name:s.full_name, phone:s.phone, role:s.role, region:s.region});
  function sAuth(tz, phone){ const s = S.soldiers.find(x=>x.tz===digits(tz)); if (!s || s.phone!==digits(phone)) fail('ת"ז או מספר טלפון שגויים'); return s; }
  function tAuth(phone, pin){ const s = S.staff.find(x=>x.phone===digits(phone)); if (!s || s.pin!==pin) fail("טלפון או קוד שגויים"); return s; }
  const seesShuttle = (me, sh) => me.role==="admin" || (me.role==="region" && sh.region===me.region) || (me.role==="commander" && sh.commander_id===me.id);
  const manages = (me, region) => me.role==="admin" || (me.role==="region" && me.region===region);
  function refreshBlock(tz, note){
    const so = S.soldiers.find(x=>x.tz===tz); if (!so) return;
    const b = S.registrations.some(r=>r.tz===tz && r.status==="no_show" && !r.resolved);
    so.blocked = b;
    if (!b) { so.block_note = null; so.appeal = null; } else if (note) so.block_note = note;
  }
  function staffShuttle(sh){
    const c = staffById(sh.commander_id);
    const passengers = S.registrations.filter(r=>r.shuttle_id===sh.id && active(r))
      .sort((a,b)=>a.created_at.localeCompare(b.created_at))
      .map(r=>{ const so = S.soldiers.find(x=>x.tz===r.tz)||{}; return {reg_id:r.id,status:r.status,tz:r.tz,first_name:so.first_name,last_name:so.last_name,phone:so.phone,created_at:r.created_at,stop:r.stop||null}; });
    return {...sh, stops:sh.stops||[], commander_name:c?.full_name||null, commander_phone:c?.phone||null, taken:passengers.length, passengers};
  }
  const out = {
    reset(){ S = seed(); save(); },
    soldier_login({p_tz,p_phone}){ const s = S.soldiers.find(x=>x.tz===digits(p_tz)); if (!s) return {exists:false}; if (s.phone!==digits(p_phone)) fail('מספר הטלפון לא תואם לת"ז הזו'); return {exists:true}; },
    soldier_signup({p_tz,p_first_name,p_last_name,p_phone,p_region}){
      if (digits(p_tz).length<5) fail('ת"ז לא תקינה');
      if (digits(p_phone).length!==10) fail("מספר טלפון לא תקין");
      if (!REGIONS.includes(p_region)) fail("יש לבחור מרחב");
      if (!String(p_first_name||"").trim() || !String(p_last_name||"").trim()) fail("יש למלא שם פרטי ושם משפחה");
      if (S.soldiers.some(x=>x.tz===digits(p_tz))) fail('ת"ז זו כבר רשומה במערכת');
      S.soldiers.push({tz:digits(p_tz),first_name:p_first_name.trim(),last_name:p_last_name.trim(),phone:digits(p_phone),region:p_region,blocked:false,block_note:null,appeal:null,created_at:nowISO()});
      save(); return {ok:true};
    },
    soldier_home({p_tz,p_phone}){
      const s = sAuth(p_tz,p_phone); const lim = Date.now()-6*3600e3;
      const shuttles = S.shuttles.filter(sh=>sh.region===s.region && new Date(sh.depart_at).getTime()>lim).sort(byDep).map(sh=>{
        const c = staffById(sh.commander_id); const m = S.registrations.find(r=>r.shuttle_id===sh.id && r.tz===s.tz && active(r));
        return {id:sh.id,region:sh.region,route:sh.route,depart_at:sh.depart_at,capacity:sh.capacity,notes:sh.notes,gather_place:sh.gather_place||null,stops:sh.stops||[],release_place:sh.release_place||null,release_time:sh.release_time||null,commander_name:c?.full_name||null,commander_phone:c?.phone||null,taken:takenOf(sh.id),mine:m?{id:m.id,status:m.status,stop:m.stop||null}:null};
      });
      const ct = S.staff.find(x=>x.role==="region" && x.region===s.region);
      const {created_at, ...sol} = s;
      return {soldier:sol, shuttles, contact: ct?{full_name:ct.full_name,phone:ct.phone}:null};
    },
    soldier_register({p_tz,p_phone,p_shuttle_id,p_stop}){
      const s = sAuth(p_tz,p_phone);
      if (s.blocked) fail("ההרשמה שלך חסומה עד להסדרת אי-הגעה קודמת");
      const sh = S.shuttles.find(x=>x.id===p_shuttle_id); if (!sh) fail("השאטל לא נמצא");
      const ex = S.registrations.find(r=>r.shuttle_id===sh.id && r.tz===s.tz && active(r));
      if (ex) return {ok:true, already:true, reg_id:ex.id, stop:ex.stop, depart_at:sh.depart_at, route:sh.route};
      if (sh.region!==s.region) fail("ניתן להירשם רק לשאטלים של המרחב שלך");
      if (new Date(sh.depart_at)<=new Date()) fail("השאטל כבר יצא");
      const opts = (sh.stops&&sh.stops.length) ? stopOptions(sh) : []; if (opts.length && !opts.includes(p_stop)) fail("יש לבחור תחנת עלייה"); if (!opts.length) p_stop = sh.gather_place || null;
      if (takenOf(sh.id)>=sh.capacity) fail("השאטל מלא — אין מקומות פנויים");
      const nr = {id:uid(),shuttle_id:sh.id,tz:s.tz,status:"registered",resolved:false,stop:p_stop||null,created_at:nowISO()};
      S.registrations.push(nr); save(); return {ok:true, already:false, reg_id:nr.id, stop:nr.stop, depart_at:sh.depart_at, route:sh.route};
    },
    soldier_cancel({p_tz,p_phone,p_reg_id}){
      const s = sAuth(p_tz,p_phone); const r = S.registrations.find(x=>x.id===p_reg_id && x.tz===s.tz);
      if (!r) fail("הרישום לא נמצא"); if (r.status!=="registered") fail("לא ניתן לבטל רישום זה");
      const sh = S.shuttles.find(x=>x.id===r.shuttle_id);
      if (Date.now() > new Date(sh.depart_at).getTime()-H24) fail("לא ניתן לבטל פחות מ-24 שעות לפני היציאה. פנה לאיש הקשר במרחב.");
      r.status = "cancelled"; save(); return {ok:true};
    },
    soldier_set_region({p_tz,p_phone,p_region}){ const s = sAuth(p_tz,p_phone); if (!REGIONS.includes(p_region)) fail("יש לבחור מרחב"); s.region = p_region; save(); return {ok:true}; },
    soldier_appeal({p_tz,p_phone,p_text}){ const s = sAuth(p_tz,p_phone); if (!String(p_text||"").trim()) fail("יש לכתוב הסבר"); s.appeal = p_text.trim().slice(0,500); save(); return {ok:true}; },
    staff_login({p_phone,p_pin}){ return pub(tAuth(p_phone,p_pin)); },
    staff_data({p_phone,p_pin}){
      const me = tAuth(p_phone,p_pin); const lim = Date.now()-14*86400e3;
      return {
        me: pub(me),
        staff: S.staff.filter(s=>me.role==="admin" || (me.role==="region" && s.region===me.region) || s.id===me.id).map(pub),
        shuttles: S.shuttles.filter(sh=>new Date(sh.depart_at).getTime()>lim && seesShuttle(me,sh)).sort(byDep).map(staffShuttle),
        blocked: me.role==="commander" ? [] : S.soldiers.filter(so=>so.blocked && (me.role==="admin" || so.region===me.region)).map(so=>({tz:so.tz,first_name:so.first_name,last_name:so.last_name,phone:so.phone,region:so.region,block_note:so.block_note,appeal:so.appeal})),
        server_time: nowISO(),
        contacts: me.role==="admin" ? S.staff.filter(s=>s.role==="region").map(s=>({region:s.region,full_name:s.full_name,phone:s.phone})) : []
      };
    },
    staff_save_shuttle({p_phone,p_pin,p_id,p_region,p_route,p_depart_at,p_capacity,p_commander_id,p_notes,p_gather_place,p_stops,p_release_place,p_release_time}){
      const me = tAuth(p_phone,p_pin); if (me.role==="commander") fail("אין הרשאה");
      const region = me.role==="region" ? me.region : p_region;
      if (!REGIONS.includes(region)) fail("יש לבחור מרחב");
      if (!String(p_route||"").trim()) fail("יש למלא מקום התייצבות ומקום שחרור");
      if (!p_depart_at) fail("יש למלא תאריך ושעה");
      const rec = {region, route:p_route.trim(), depart_at:p_depart_at, capacity:+p_capacity||55, commander_id:p_commander_id||null, notes:(p_notes||"").trim()||null, gather_place:(p_gather_place||"").trim()||null, stops:Array.isArray(p_stops)?p_stops:[], release_place:(p_release_place||"").trim()||null, release_time:(p_release_time||"").trim()||null};
      if (!p_id) { const id = uid(); S.shuttles.push({id, ...rec}); save(); return {id}; }
      const sh = S.shuttles.find(x=>x.id===p_id); if (!sh) fail("השאטל לא נמצא");
      if (me.role==="region" && sh.region!==me.region) fail("אין הרשאה");
      Object.assign(sh, rec); save(); return {id:p_id};
    },
    staff_delete_shuttle({p_phone,p_pin,p_id}){
      const me = tAuth(p_phone,p_pin); const sh = S.shuttles.find(x=>x.id===p_id); if (!sh) fail("השאטל לא נמצא");
      if (!manages(me, sh.region)) fail("אין הרשאה");
      S.shuttles = S.shuttles.filter(x=>x.id!==p_id); S.registrations = S.registrations.filter(r=>r.shuttle_id!==p_id); save(); return {ok:true};
    },
    staff_mark({p_phone,p_pin,p_reg_id,p_status}){
      const me = tAuth(p_phone,p_pin);
      if (!["registered","at_pickup","boarded","no_show","arrived"].includes(p_status)) fail("סטטוס לא חוקי");
      const r = S.registrations.find(x=>x.id===p_reg_id); if (!r || r.status==="cancelled") fail("הרישום לא נמצא");
      const sh = S.shuttles.find(x=>x.id===r.shuttle_id); if (!seesShuttle(me, sh)) fail("אין הרשאה");
      r.status = p_status; r.resolved = false;
      refreshBlock(r.tz, p_status==="no_show" ? `נרשמת לשאטל "${sh.route}" ב-${fmtDM(sh.depart_at)} ${fmtTime(sh.depart_at)} ולא הגעת.` : null);
      save(); return {ok:true};
    },
    staff_remove_reg({p_phone,p_pin,p_reg_id}){
      const me = tAuth(p_phone,p_pin); const r = S.registrations.find(x=>x.id===p_reg_id); if (!r) fail("הרישום לא נמצא");
      const sh = S.shuttles.find(x=>x.id===r.shuttle_id); if (!manages(me, sh.region)) fail("אין הרשאה");
      r.status = "cancelled"; refreshBlock(r.tz, null); save(); return {ok:true};
    },
    staff_release({p_phone,p_pin,p_tz}){
      const me = tAuth(p_phone,p_pin); const so = S.soldiers.find(x=>x.tz===p_tz); if (!so) fail("החייל לא נמצא");
      if (!manages(me, so.region)) fail("אין הרשאה");
      S.registrations.forEach(r=>{ if (r.tz===p_tz && r.status==="no_show") r.resolved = true; });
      so.blocked = false; so.block_note = null; so.appeal = null; save(); return {ok:true};
    },
    staff_save_staff({p_phone,p_pin,p_id,p_full_name,p_new_phone,p_new_pin,p_role,p_region}){
      const me = tAuth(p_phone,p_pin); if (me.role==="commander") fail("אין הרשאה");
      const role = me.role==="region" ? "commander" : p_role;
      const region = me.role==="region" ? me.region : role==="admin" ? null : p_region;
      if (!ROLE_LABEL[role]) fail("תפקיד לא חוקי");
      if (role!=="admin" && !REGIONS.includes(region)) fail("יש לבחור מרחב");
      if (!String(p_full_name||"").trim()) fail("יש למלא שם");
      const ph = digits(p_new_phone); if (ph.length!==10) fail("מספר טלפון לא תקין");
      if (S.staff.some(s=>s.phone===ph && s.id!==p_id)) fail("מספר הטלפון כבר קיים במערכת");
      if (!p_id) { if (String(p_new_pin||"").length<4) fail("קוד כניסה חייב להיות לפחות 4 תווים"); const id = uid(); S.staff.push({id,full_name:p_full_name.trim(),phone:ph,pin:p_new_pin,role,region}); save(); return {id}; }
      const t = S.staff.find(s=>s.id===p_id); if (!t) fail("איש הצוות לא נמצא");
      if (me.role==="region" && !(t.role==="commander" && t.region===me.region)) fail("אין הרשאה");
      Object.assign(t, {full_name:p_full_name.trim(), phone:ph, role, region}); if (p_new_pin) t.pin = p_new_pin;
      save(); return {id:p_id};
    },
    staff_delete_staff({p_phone,p_pin,p_id}){
      const me = tAuth(p_phone,p_pin); if (me.id===p_id) fail("לא ניתן למחוק את עצמך");
      const t = S.staff.find(s=>s.id===p_id); if (!t) fail("איש הצוות לא נמצא");
      if (!(me.role==="admin" || (me.role==="region" && t.role==="commander" && t.region===me.region))) fail("אין הרשאה");
      S.staff = S.staff.filter(s=>s.id!==p_id); S.shuttles.forEach(sh=>{ if (sh.commander_id===p_id) sh.commander_id = null; }); save(); return {ok:true};
    }
  };
  return out;
})();

/* ======================================================================
   App state
   ====================================================================== */
const SKEY = "s820_session";
let session = store.get(SKEY);
let data = null;
const ui = { loginTab:"soldier", signup:null, tab:null, region:"all", past:false, open:{}, day:null, pickRegion: store.get("s820_region") };

const cred = () => session.type==="soldier" ? {p_tz:session.tz, p_phone:session.phone} : {p_phone:session.phone, p_pin:session.pin};
const net = { last:null, ok:true };
async function load(){
  try {
    data = session.type==="soldier" ? await call("soldier_home", cred()) : await call("staff_data", cred());
    net.last = new Date(); net.ok = true;
  } catch(e) { if (e.network) net.ok = false; throw e; }
}
const clock = d => d ? pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()) : "—";
async function reload(){ await load(); render(); }
async function startSession(s){
  session = s; store.set(SKEY, s);
  ui.tab = null; ui.open = {}; ui.region = "all"; ui.past = false; ui.day = null;
  try { await load(); } catch(e){ session = null; store.del(SKEY); data = null; throw e; }
  render();
}
function logout(){ session = null; data = null; store.del(SKEY); ui.signup = null; render(); }

/* ======================================================================
   Views
   ====================================================================== */
function render(){
  const app = $("#app");
  const ribbon = LIVE ? "" : `<div class="demo-ribbon">מצב הדגמה — הנתונים נשמרים רק בדפדפן הזה. לחיבור אמיתי יש למלא פרטי Supabase.</div>`;
  if (!session || !data) { app.innerHTML = ribbon + loginView(); return; }
  app.innerHTML = ribbon + topBar() + (session.type==="soldier" ? soldierView() : staffView());
}

function topBar(){
  let nm, role;
  if (session.type==="soldier") { nm = data.soldier.first_name+" "+data.soldier.last_name; role = "חייל · מרחב "+data.soldier.region; }
  else { nm = data.me.full_name; role = ROLE_LABEL[data.me.role] + (data.me.region ? " · "+data.me.region : ""); }
  return `<div class="top"><div class="top-in">
    <div class="logo"><span aria-hidden="true">${busSvg("#e8a820",28)}</span> מערך שאטלים <span class="n">820</span></div>
    <div class="who"><div><b class="nmx">${esc(nm)}</b> <span class="role">${esc(role)}</span></div>

      <button class="iconbtn" data-act="logout">יציאה</button></div>
  </div></div>`;
}

/* ---------- days ---------- */
function shortDay(iso){
  const d = new Date(iso), t = new Date(); t.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const diff = Math.round((dd - t)/86400000);
  return diff===0 ? "היום" : diff===1 ? "מחר" : diff===-1 ? "אתמול" : WD[d.getDay()];
}
function fullDate(iso){ const d = new Date(iso); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear(); }
function keyDate(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d, 12); }
function longDay(isoOrKey){
  const d = isoOrKey.length===10 ? keyDate(isoOrKey) : new Date(isoOrKey);
  const sd = shortDay(d.toISOString());
  return (sd==="היום"||sd==="מחר"||sd==="אתמול" ? sd+", יום "+WD[d.getDay()] : "יום "+WD[d.getDay()]) + " " + fullDate(d.toISOString());
}
const ST_LABEL = {registered:"שמר מקום", at_pickup:"בנקודת האיסוף", boarded:"עלה לשאטל", no_show:"לא הגיע", arrived:"סומן 'הגיע' (סימון ישן)"};
const freeSeats = sh => Math.max(0, sh.capacity - sh.taken);
function dayKeys(list){ return [...new Set(list.map(s=>dayKey(s.depart_at)))]; }
function pickDay(list){
  const keys = dayKeys(list);
  if (!keys.includes(ui.day)) {
    const now = Date.now();
    const nxt = list.find(s=>new Date(s.depart_at).getTime() > now - 3600e3);
    ui.day = nxt ? dayKey(nxt.depart_at) : keys[0];
  }
  return ui.day;
}
function dayChipsHTML(list, sel, markDays){
  return `<div class="days" role="group" aria-label="בחירת יום" id="dayChips">${dayKeys(list).map(k=>{
    const day = list.filter(x=>dayKey(x.depart_at)===k);
    const mine = markDays && markDays.has(k);
    return `<button class="dchip ${k===sel?"on":""}" data-act="day" data-v="${k}" aria-pressed="${k===sel}" aria-label="${longDay(k)}, ${day.length} שאטלים${mine?", יש לך מקום שמור ביום הזה":""}"><span class="dw">${shortDay(day[0].depart_at)}</span><span class="dd">${fullDate(day[0].depart_at)}</span><span class="dn">${day.length} שאטלים</span>${mine?`<span class="dot" aria-hidden="true">●</span>`:""}</button>`;
  }).join("")}</div>`;
}
function bucketOf(iso){ const h = new Date(iso).getHours(); return h < 12 ? 0 : h < 17 ? 1 : 2; }
const BUCKETS = ["☀️ בוקר","🌤️ צהריים","🌙 ערב"];
function bucketed(list, cardFn){
  let h = "";
  for (let b=0;b<3;b++){
    const part = list.filter(s=>bucketOf(s.depart_at)===b);
    if (!part.length) continue;
    h += `<div class="bucket">${BUCKETS[b]} <span class="ct">· ${part.length} שאטלים</span></div>` + part.map(cardFn).join("");
  }
  return h;
}

function openReserve(id){

async function submitReserve(form){
  const sh = ui.pending; const st = ui.rstate; if (!sh || st.step==="saving") return;
  const opts = (sh.stops && sh.stops.length) ? stopOptions(sh) : [];
  const chosen = form.querySelector('input[name=stop]:checked');
  st.stop = chosen ? chosen.value : (opts.length ? null : sh.gather_place);
  if (opts.length && !st.stop) { st.fieldErr = "יש לבחור תחנת עלייה"; st.err = null; redrawReserve(); setTimeout(()=>{ const r = $("#modalRoot input[name=stop]"); r && r.focus(); }, 30); return; }
  st.fieldErr = null; st.err = null; st.step = "saving"; redrawReserve();
  try {
    const res = await call("soldier_register", {...cred(), p_shuttle_id: sh.id, p_stop: st.stop});
    if (!res || res.ok !== true) throw new Error("השרת לא אישר את שמירת המקום. נסה שוב.");
    st.step = "done"; st.already = !!res.already; st.stop = res.stop || st.stop;
    redrawReserve(); toast("המקום שלך אושר: " + longDay(sh.depart_at) + " " + fmtTime(sh.depart_at));
    try { await load(); render(); } catch(e) {}
  } catch(e) {
    st.step = "choose"; st.err = e.message || "שגיאה בשמירת המקום";
    st.final = /מלא|חסומה|יצא|המרחב/.test(st.err);
    redrawReserve(); setTimeout(()=>{ const b = $("#modalRoot .formerr"); b && b.setAttribute("tabindex","-1"); b && b.focus(); }, 30);
    if (st.final) { try { await load(); render(); } catch(_){} }
  }
}

  if (!ui.tab || !tabs.some(t=>t[0]===ui.tab)) ui.tab = tabs[0][0];

  const sync = `<div class="sync"><span class="${net.ok?"on":"off"}">${net.ok?"● מחובר":"⚠ אין חיבור לשרת — מוצגים הנתונים האחרונים שהתקבלו"}</span><span>עודכן לאחרונה: <b>${clock(net.last)}</b></span><span class="muted">רענון אוטומטי כל 30 שניות (לא זמן אמת)</span><button class="lnk small" data-act="refresh">רענון עכשיו</button></div>`;
  let h = `<main class="wrap" id="main">${sync}<div class="tabs" role="group" aria-label="לשוניות">${tabs.map(([k,l])=>`<button class="tab ${ui.tab===k?"on":""}" data-act="tab" data-v="${k}" aria-pressed="${ui.tab===k}">${l}${k==="blocked"&&nb?` <span class="badge">${nb}</span>`:""}</button>`).join("")}</div>`;
  if (ui.tab==="overview") h += overviewView();
  else if (ui.tab==="shuttles") h += shuttlesView();
  else if (ui.tab==="blocked") h += blockedView();
  else if (ui.tab==="staff") h += staffMgmtView();
  else h += commanderView();
  return h + `</main>`;
}
const canManage = () => data.me.role==="admin" || data.me.role==="region";
const countBy = (sh, st) => sh.passengers.filter(p=>p.status===st).length;

function overviewView(){
  const t0 = startOfToday();
  const up = data.shuttles.filter(s=>new Date(s.depart_at).getTime() >= t0);
  const seats = up.reduce((a,s)=>a+s.capacity,0), taken = up.reduce((a,s)=>a+s.taken,0);
  const fulls = up.filter(s=>s.taken>=s.capacity).length;
  const ns = data.shuttles.reduce((a,s)=>a+countBy(s,"no_show"),0);
  let h = `<div class="stats">
    <div class="card stat"><div class="v">${up.length}</div><div class="l">שאטלים קרובים</div></div>
    <div class="card stat"><div class="v">${taken}<span class="muted" style="font-size:16px">/${seats}</span></div><div class="l">מקומות תפוסים</div></div>
    <div class="card stat ${fulls?"red":""}"><div class="v">${fulls}</div><div class="l">אוטובוסים מלאים</div></div>
    <div class="card stat ${ns?"red":""}"><div class="v">${ns}</div><div class="l">לא הגיעו (14 יום)</div></div>
    <div class="card stat ${data.blocked.length?"red":""}"><div class="v">${data.blocked.length}</div><div class="l">חיילים חסומים</div></div>
  </div><div class="section-title">לפי מרחב — מהיום והלאה</div><div class="regions">`;
  for (const r of REGIONS) {
    const list = up.filter(s=>s.region===r);
    const ct = data.contacts.find(c=>c.region===r);
    const rt = list.reduce((a,s)=>a+s.taken,0), rc = list.reduce((a,s)=>a+s.capacity,0);
    h += `<div class="card regbox"><div class="reghead"><div><h3>מרחב ${r}</h3>
        <div class="small muted">איש קשר: ${ct ? esc(ct.full_name)+" · "+telLink(ct.phone) : "<b style='color:var(--red)'>לא הוגדר</b>"}</div></div>
        <div style="text-align:left"><div class="seatsn">${rt}/${rc}</div><div class="tiny muted">${list.length} שאטלים</div></div></div>`;
    if (!list.length) h += `<div class="small muted" style="padding:8px 2px">אין שאטלים מתוכננים</div>`;
    for (const s of list) {
      const full = s.taken >= s.capacity;
      h += `<div class="mini ${full?"isfull":""}" data-act="openShuttle" data-id="${esc(s.id)}" role="button" tabindex="0" aria-label="שאטל ${fmtTime(s.depart_at)} ${esc(s.route)}, ${s.taken} מתוך ${s.capacity} שמורים">
        <div class="tm">${fmtTime(s.depart_at)}</div>
        <div><b>${esc(s.route)}</b></div>
        <div class="row" style="gap:6px">${full?`<span class="chip full">מלא</span>`:""}<span class="seatsn">${s.taken}/${s.capacity}</span></div>
        <div class="sub">${longDay(s.depart_at)} · מפקד: ${esc(s.commander_name||"—")}</div>
      </div>`;
    }
    h += `</div>`;
  }
  return h + `</div>`;
}

function sideTable(dayList, title){
  const f = ui.sideShuttle && dayList.some(s=>s.id===ui.sideShuttle) ? ui.sideShuttle : "all";
  const shown = f==="all" ? dayList : dayList.filter(s=>s.id===f);
  lastSideList = shown;
  const total = shown.reduce((a,s)=>a+s.passengers.length,0);
  const open = ui.sideOpen === undefined ? window.innerWidth > 1000 : ui.sideOpen;
  let rows = "";
  for (const s of shown) {
    if (!s.passengers.length) continue;
    const k = shuttleCounts(s);
    rows += `<tr class="grp"><th scope="rowgroup" colspan="4">${fmtTime(s.depart_at)} · ${esc(s.gather_place||"")} ← ${esc(s.release_place||"")}${data.me.role==="admin"?` · ${esc(s.region)}`:""} <span class="gsub">(${k.reserved}/${k.cap} שמורים · ${k.boarded} עלו)</span></th></tr>`;
    for (const p of s.passengers.slice().sort(stopSort(s))) {
      const cls = p.status==="boarded"||p.status==="arrived" ? "st-ok" : p.status==="no_show" ? "st-bad" : "";
      rows += `<tr><td><b>${esc(p.first_name)} ${esc(p.last_name)}</b></td><td>${esc(p.stop||"—")}</td><td dir="ltr" style="text-align:right">${telLink(p.phone)}</td><td class="${cls}">${ST_LABEL[p.status]||p.status}</td></tr>`;
    }
  }
  return `<details class="card side" data-side ${open?"open":""}>
    <summary class="side-h"><span class="h3">📋 ${esc(title)}</span><span class="chip info">${total} נרשמים</span></summary>
    <div class="side-tools">
      <label class="small">שאטל: <select class="in" data-change="sideShuttle" style="width:auto;padding:6px 8px">
        <option value="all">כל השאטלים ביום (${dayList.length})</option>
        ${dayList.map(s=>`<option value="${esc(s.id)}" ${f===s.id?"selected":""}>${fmtTime(s.depart_at)} · ${esc(s.gather_place||"")} ← ${esc(s.release_place||"")} (${s.passengers.length})</option>`).join("")}
      </select></label>
      ${total?`<button class="btn ghost sm" data-act="copyDay">העתק לאקסל</button>`:""}
    </div>
    ${total ? `<table class="reg"><caption class="sr-only">${esc(title)}</caption><thead><tr><th scope="col">שם</th><th scope="col">תחנה</th><th scope="col">טלפון</th><th scope="col">מצב</th></tr></thead><tbody>${rows}</tbody></table>`
            : `<p class="empty small">עוד אין נרשמים ${f==="all"?"ביום הזה":"בשאטל הזה"}</p>`}
  </details>`;
}
let lastSideList = [];
document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details[data-side]")) ui.sideOpen = e.target.open; }, true);

    <div class="seg" style="margin:0;width:auto"><button data-act="past" data-v="0" class="${!ui.past?"on":""}">קרובים</button><button data-act="past" data-v="1" class="${ui.past?"on":""}">קודמים</button></div>

function commanderView(){
  const now = Date.now();
  const list = data.shuttles.filter(s=>new Date(s.depart_at).getTime() > now - 3*86400e3).sort((a,b)=>new Date(a.depart_at)-new Date(b.depart_at));
  let h = `<p class="rules" style="margin-bottom:14px">לכל נוסע סמן: <b>📍 בנקודת האיסוף</b> כשהגיע לתחנה, <b>✓ עלה לשאטל</b> כשעלה בפועל, או <b>✗ לא הגיע</b>. נוסע שסומן "לא הגיע" נחסם להרשמה עד שאיש הקשר במרחב משחרר אותו.</p>`;
  if (!list.length) return h + `<div class="card empty">לא שובצת כמפקד נסיעה לשאטל קרוב</div>`;

function shuttleCounts(s){
  const c = (st) => s.passengers.filter(p=>p.status===st).length;
  return { cap:s.capacity, reserved:s.passengers.length, free:Math.max(0,s.capacity-s.passengers.length), pickup:c("at_pickup"), boarded:c("boarded"), legacy:c("arrived"), noshow:c("no_show"), waiting:c("registered") };
}

        <div class="meta">${releaseLine(s)||""}${s.notes?" · "+esc(s.notes):""} · מפקד נסיעה: ${esc(s.commander_name||"טרם שובץ")}</div>${stopsLine(s)}</div>
      <div class="seatbox"><div class="row"><span class="seatsn">${k.reserved}/${k.cap} שמורים</span>${k.free===0?`<span class="chip full">מלא</span>`:""}</div>${seatBar(k.reserved,k.cap)}</div>

      <div class="${k.noshow?"bad":""}"><dt>לא הגיעו</dt><dd>${k.noshow}</dd></div>
      ${k.legacy?`<div><dt>סימון ישן "הגיע"</dt><dd>${k.legacy}</dd></div>`:""}

  if (open) {
    h += `<div class="shc-b" id="${panelId}">
      <div class="row between" style="margin-bottom:10px">
        <p class="tiny muted" style="margin:0">לכל נוסע: <b>בנקודת האיסוף</b> = הגיע לתחנה · <b>עלה לשאטל</b> = עלה בפועל · לחיצה שנייה מחזירה ל"שמר מקום"</p>
        ${canManage() ? `<div class="row" style="gap:6px">
          <button class="btn ghost sm" data-act="editShuttle" data-id="${esc(s.id)}">עריכה</button>
          <button class="btn ghost sm" data-act="dupShuttle" data-id="${esc(s.id)}">שכפול לשבוע הבא</button>
          <button class="btn ghost sm" data-act="copyList" data-id="${esc(s.id)}">העתק רשימה</button>
          <button class="btn ghost sm danger-t" data-act="delShuttle" data-id="${esc(s.id)}">מחיקה</button></div>`
          : `<button class="btn ghost sm" data-act="copyList" data-id="${esc(s.id)}">העתק רשימה</button>`}
      </div>`;
    if (!s.passengers.length) h += `<p class="small muted" style="padding:6px 2px">אין עדיין נרשמים</p>`;
    else {
      h += `<ul class="pl">`;
      let lastStop = null;
      s.passengers.slice().sort(stopSort(s)).forEach((p,i)=>{
        if (stopOptions(s).length && p.stop !== lastStop) { lastStop = p.stop; h += `<li class="stopgrp">📍 ${esc(p.stop||"ללא תחנה")} · ${s.passengers.filter(x=>x.stop===p.stop).length}</li>`; }
        const nm = esc(p.first_name+" "+p.last_name);
        const b = (st, cls, label) => `<button class="mk ${cls} ${p.status===st?"on":""}" data-act="mark" data-reg="${esc(p.reg_id)}" data-st="${st}" data-cur="${p.status}" aria-pressed="${p.status===st}">${label}</button>`;
        h += `<li class="pr st-${p.status}">

          </div></li>`;
      });
      h += `</ul>`;
    }
    h += `</div>`;
  }
  return h + `</article>`;
}

    </div>
    <label class="f"><span>הערות (לא חובה)</span><input class="in" name="notes" placeholder="לדוגמה: להגיע 10 דקות לפני" value="${esc(sh?.notes||"")}"></label>
    <div class="row end"><button type="button" class="btn ghost" data-act="mclose">ביטול</button><button class="btn primary" type="submit">שמירה</button></div>
  </form>`);
}
function staffForm(st){
  const me = data.me;
  openModal(`<h3>${st ? "עריכת איש צוות" : (me.role==="admin" ? "איש צוות חדש" : "מפקד נסיעה חדש")}</h3><form data-form="staff">
    <input type="hidden" name="id" value="${esc(st?.id||"")}">
    <label class="f"><span>שם מלא</span><input class="in" name="name" required value="${esc(st?.full_name||"")}"></label>
    <label class="f"><span>טלפון (משמש לכניסה)</span><input class="in" name="phone" inputmode="tel" dir="ltr" required value="${esc(st?.phone||"")}"></label>
    ${me.role==="admin" ? `<div class="grid2">
      <label class="f"><span>תפקיד</span><select class="in" name="role" required>${Object.entries(ROLE_LABEL).map(([k,l])=>`<option value="${k}" ${(st?.role||"commander")===k?"selected":""}>${l}</option>`).join("")}</select></label>
      <label class="f"><span>מרחב</span><select class="in" name="region"><option value="">— (למנהל)</option>${REGIONS.map(r=>`<option ${st?.region===r?"selected":""}>${r}</option>`).join("")}</select></label>
    </div>` : `<input type="hidden" name="role" value="commander"><input type="hidden" name="region" value="${esc(me.region)}">`}
    <label class="f"><span>${st ? "קוד כניסה חדש (השאר ריק כדי לא לשנות)" : "קוד כניסה (4 ספרות לפחות)"}</span><input class="in" name="pin" dir="ltr" ${st?"":"required"} minlength="4" autocomplete="new-password"></label>
    <div class="row end"><button type="button" class="btn ghost" data-act="mclose">ביטול</button><button class="btn primary" type="submit">שמירה</button></div>
  </form>`);
}

/* ======================================================================
   Events
   ====================================================================== */
const DEMO_LOGINS = {
  admin:{type:"staff",phone:"0500000001",pin:"1234"},
  region:{type:"staff",phone:"0500000012",pin:"1111"},
  commander:{type:"staff",phone:"0500000021",pin:"2222"},
  soldier:{type:"soldier",tz:"123456789",phone:"0521234567"},
  blocked:{type:"soldier",tz:"987654321",phone:"0527654321"}
};
const findSh = id => data.shuttles.find(s=>s.id===id);

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a==="mbg") { if (e.target===el) closeModal(); return; }
  try {
    switch (a) {
      case "mclose": closeModal(); break;
      case "ltab": ui.loginTab = el.dataset.v; ui.signup = null; render(); break;
      case "pickRegion": ui.pickRegion = el.dataset.v; store.set("s820_region", ui.pickRegion); render(); break;
      case "unpickRegion": ui.pickRegion = null; ui.signup = null; render(); break;
      case "day": ui.day = el.dataset.v; render(); break;
      case "changeRegion": openModal(`<h3>החלפת מרחב</h3><div class="small muted">תראה את השאטלים של המרחב שתבחר</div>${regionTiles("setRegion", data.soldier.region)}<div class="row end" style="margin-top:14px"><button class="btn ghost" data-act="mclose">ביטול</button></div>`); break;
      case "setRegion": {
        const r = el.dataset.v; closeModal();
        if (r !== data.soldier.region) { await call("soldier_set_region", {...cred(), p_region:r}); ui.pickRegion = r; store.set("s820_region", r); ui.day = null; await reload(); toast("עברת למרחב "+r); }
        break;
      }
      case "copyDay": {
        const lines = ["שעה\tמסלול\tשם\tטלפון\tתחנה\tסטטוס"];
        for (const s of lastSideList) for (const p of s.passengers.slice().sort(stopSort(s)))
          lines.push([fmtTime(s.depart_at), s.route, p.first_name+" "+p.last_name, p.phone, p.stop||"", ST_LABEL[p.status]||p.status].join("\t"));
        const txt = lines.join("\n");
        try { await navigator.clipboard.writeText(txt); toast("הטבלה הועתקה — אפשר להדביק באקסל"); }
        catch(err){ openModal(`<h3>טבלת נרשמים</h3><textarea class="in" style="min-height:260px" readonly>${esc(txt)}</textarea><div class="row end" style="margin-top:10px"><button class="btn ghost" data-act="mclose">סגירה</button></div>`); }
        break;
      }
      case "unsignup": ui.signup = null; render(); break;
      case "demo": await startSession({...DEMO_LOGINS[el.dataset.v]}); break;
      case "demoReset": Demo.reset(); toast("נתוני ההדגמה אופסו"); break;
      case "logout": logout(); break;
      case "refresh": await reload(); toast("עודכן"); break;
      case "tab": ui.tab = el.dataset.v; render(); window.scrollTo(0,0); break;
      case "past": ui.past = el.dataset.v==="1"; render(); break;
      case "toggle": {
        const cur = data.me.role==="commander" ? ui.open[id]!==false : !!ui.open[id];
        ui.open[id] = !cur; render(); break;
      }
      case "openShuttle": {
        const s = findSh(id); ui.tab = "shuttles"; ui.region = s.region; ui.past = false; ui.day = dayKey(s.depart_at); ui.open[id] = true; render();
        setTimeout(()=>{ const n = document.getElementById("sh-"+id); n && n.scrollIntoView({behavior:"smooth",block:"start"}); }, 30);
        break;
      }
      case "register": openReserve(id); break;
      case "goMine": closeModal(); ui.sview = "mine"; render(); window.scrollTo(0,0); break;
      case "sview": ui.sview = el.dataset.v; render(); window.scrollTo(0,0); break;
      case "focusDays": { const d = document.querySelector("#dayChips .dchip.on") || document.querySelector("#dayChips .dchip"); d && d.focus(); break; }
      case "toggleMotion": { const on = !document.body.classList.contains("still"); document.body.classList.toggle("still", on); store.set("s820_still", on); el.setAttribute("aria-pressed", String(on)); el.textContent = on ? "▶ הפעלת אנימציה" : "⏸ עצירת אנימציה"; break; }
      case "cancel": {
        const ok = await ask("ביטול שמירת מקום", "לבטל את שמירת המקום? המקום יתפנה לחייל אחר.", "כן, לבטל", true); if (!ok) return;
        await call("soldier_cancel", {...cred(), p_reg_id:id}); await reload(); toast("שמירת המקום בוטלה"); break;
      }
      case "editAppeal": {
        openModal(`<h3>עריכת ההסבר</h3>${appealForm(data.soldier.appeal||"")}`); break;
      }
      case "mark": {
        const st = el.dataset.cur===el.dataset.st ? "registered" : el.dataset.st;
        await call("staff_mark", {...cred(), p_reg_id:el.dataset.reg, p_status:st}); await reload();
        toast(st==="no_show" ? "סומן: לא הגיע — הנוסע נחסם להרשמה" : "סומן: " + (ST_LABEL[st]||st));
        break;
      }
      case "removeReg": {
        const ok = await ask("הסרה מהשאטל", `להסיר את <b>${esc(el.dataset.name)}</b> מרשימת השאטל?`, "הסרה", true); if (!ok) return;
        await call("staff_remove_reg", {...cred(), p_reg_id:el.dataset.reg}); await reload(); toast("הוסר מהשאטל"); break;
      }
      case "newShuttle": shuttleForm(null,false); break;
      case "editShuttle": shuttleForm(findSh(id),false); break;
      case "dupShuttle": shuttleForm(findSh(id),true); break;
      case "delShuttle": {
        const s = findSh(id);
        const ok = await ask("מחיקת שאטל", `למחוק את <b>${esc(s.route)}</b> (${dayLabel(s.depart_at)} ${fmtTime(s.depart_at)})?${s.taken?`<br><b style="color:var(--red)">${s.taken} חיילים רשומים לשאטל הזה.</b>`:""}`, "מחיקה", true);
        if (!ok) return;
        await call("staff_delete_shuttle", {...cred(), p_id:id}); await reload(); toast("השאטל נמחק"); break;
      }
      case "copyList": {
        const s = findSh(id);
        let lastSt = null;
        const txt = `🚌 ${s.route} · ${dayLabel(s.depart_at)}\nהתייצבות ${fmtTime(s.depart_at)}${s.gather_place?" ב"+s.gather_place:""}${s.release_time||s.release_place?` · שחרור ${s.release_time||""} ${s.release_place?"ב"+s.release_place:""}`:""}\nמפקד נסיעה: ${s.commander_name||"—"}\nרשומים: ${s.taken}/${s.capacity}\n` + s.passengers.slice().sort(stopSort(s)).map((p,i)=>{ let hd=""; if (p.stop!==lastSt){ lastSt=p.stop; hd=`\n📍 ${p.stop||"ללא תחנה"}\n`; } return hd+`${i+1}. ${p.first_name} ${p.last_name} · ${p.phone}${p.status==="arrived"?" ✓":p.status==="no_show"?" ✗":""}`; }).join("\n");
        try { await navigator.clipboard.writeText(txt); toast("הרשימה הועתקה — אפשר להדביק בוואטסאפ"); }
        catch(err){ openModal(`<h3>רשימת נוסעים</h3><textarea class="in" style="min-height:260px" readonly>${esc(txt)}</textarea><div class="row end" style="margin-top:10px"><button class="btn ghost" data-act="mclose">סגירה</button></div>`); }
        break;
      }
      case "release": {
        const ok = await ask("שחרור חסימה", `לשחרר את <b>${esc(el.dataset.name)}</b>? החייל יוכל שוב להירשם לשאטלים.`, "שחרור"); if (!ok) return;
        await call("staff_release", {...cred(), p_tz:el.dataset.tz}); await reload(); toast("החסימה שוחררה ✓"); break;
      }
      case "newStaff": staffForm(null); break;
      case "editStaff": staffForm(data.staff.find(s=>s.id===id)); break;
      case "delStaff": {
        const s = data.staff.find(x=>x.id===id);
        const ok = await ask("מחיקת איש צוות", `למחוק את <b>${esc(s.full_name)}</b> (${ROLE_LABEL[s.role]})?`, "מחיקה", true); if (!ok) return;
        await call("staff_delete_staff", {...cred(), p_id:id}); await reload(); toast("נמחק"); break;
      }
    }
  } catch(err) { toast(err.message || "שגיאה", "err"); }
});

document.addEventListener("change", e => {
  const el = e.target.closest("[data-change]"); if (!el) return;
  if (el.dataset.change==="region") { ui.region = el.value; ui.day = null; render(); }
  if (el.dataset.change==="sideShuttle") { ui.sideShuttle = el.value; render(); const n = document.querySelector('[data-change="sideShuttle"]'); n && n.focus(); }
});

function fieldErr(form, name, msg){
  const f = form.querySelector(`[name="${name}"]`); if (!f) return;
  const id = "err-"+form.dataset.form+"-"+name;
  f.setAttribute("aria-invalid","true"); f.setAttribute("aria-describedby", id);
  let d = document.getElementById(id); if (!d) { d = document.createElement("div"); d.id = id; d.className = "ferr"; f.insertAdjacentElement("afterend", d); }
  d.textContent = "⚠ " + msg;
}
function clearErrs(form){
  form.querySelectorAll(".ferr").forEach(x=>x.remove());
  form.querySelectorAll("[aria-invalid]").forEach(x=>{ x.removeAttribute("aria-invalid"); x.removeAttribute("aria-describedby"); });
  form.querySelectorAll(".formerr").forEach(x=>x.remove());
}
class FieldError extends Error { constructor(map){ super("יש לתקן את השדות המסומנים"); this.map = map; } }
const FORMS = {
  async reserve(f, form){ await submitReserve(form); },
  async soldierLogin(f){
    const tz = digits(f.tz), phone = digits(f.phone); const errs = {};
    if (tz.length<5 || tz.length>9) errs.tz = 'תעודת זהות צריכה להכיל 5 עד 9 ספרות';
    if (phone.length!==10 || !phone.startsWith("05")) errs.phone = "מספר טלפון נייד: 10 ספרות שמתחילות ב-05";
    if (Object.keys(errs).length) throw new FieldError(errs);
    const r = await call("soldier_login", {p_tz:tz, p_phone:phone});
    if (!r.exists) { ui.signup = {tz, phone}; render(); return; }
    await startSession({type:"soldier", tz, phone});
    if (ui.pickRegion && data.soldier.region !== ui.pickRegion) {
      await call("soldier_set_region", {...cred(), p_region: ui.pickRegion}); await reload(); toast("המרחב שלך עודכן ל"+ui.pickRegion);
    }
  },
  async signup(f){
    const errs = {}; if (!String(f.first||"").trim()) errs.first = "יש למלא שם פרטי"; if (!String(f.last||"").trim()) errs.last = "יש למלא שם משפחה";
    if (Object.keys(errs).length) throw new FieldError(errs);
    await call("soldier_signup", {p_tz:ui.signup.tz, p_first_name:f.first, p_last_name:f.last, p_phone:ui.signup.phone, p_region:ui.pickRegion});
    const s = {type:"soldier", tz:ui.signup.tz, phone:ui.signup.phone}; ui.signup = null;
    await startSession(s); toast("נרשמת למערכת ✓");
  },
  async staffLogin(f){
    const phone = digits(f.phone);
    if (phone.length!==10) throw new FieldError({phone:"מספר טלפון: 10 ספרות"});
    if (!f.pin) throw new FieldError({pin:"יש להזין קוד כניסה"});
    await call("staff_login", {p_phone:phone, p_pin:f.pin});
    await startSession({type:"staff", phone, pin:f.pin});
  },
  async appeal(f){
    await call("soldier_appeal", {...cred(), p_text:f.text}); if (modalOpen()) closeModal(); await reload(); toast("ההסבר נשלח לאיש הקשר");
  },
  async shuttle(f){
    const dt = new Date(`${f.date}T${f.time}`);
    if (isNaN(dt)) throw new Error("תאריך או שעה לא תקינים");
    const stops = String(f.stops||"").split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);
    await call("staff_save_shuttle", {...cred(), p_id:f.id||null, p_region:f.region, p_route:`${f.gather.trim()} ← ${f.release.trim()}`, p_depart_at:dt.toISOString(), p_capacity:+f.capacity||55, p_commander_id:f.commander||null, p_notes:f.notes||"", p_gather_place:f.gather, p_stops:stops, p_release_place:f.release, p_release_time:f.release_time||""});
    closeModal(); await reload(); toast("השאטל נשמר ✓");
  },
  async staff(f){
    await call("staff_save_staff", {...cred(), p_id:f.id||null, p_full_name:f.name, p_new_phone:f.phone, p_new_pin:f.pin||null, p_role:f.role, p_region:f.region||null});
    // if I changed my own phone/pin — update session
    if (f.id && f.id===data.me.id) { session.phone = digits(f.phone); if (f.pin) session.pin = f.pin; store.set(SKEY, session); }
    closeModal(); await reload(); toast("נשמר ✓");
  }
};
document.addEventListener("submit", async e => {
  const form = e.target.closest("form[data-form]"); if (!form) return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(form).entries());
  const btn = form.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
  if (form.dataset.form !== "reserve") clearErrs(form);
  try { await FORMS[form.dataset.form](f, form); }
  catch(err) {
    if (!form.isConnected) { toast(err.message || "שגיאה", "err"); }
    else if (err.map) { for (const [k,v] of Object.entries(err.map)) fieldErr(form, k, v); const first = form.querySelector("[aria-invalid=true]"); first && first.focus(); const a = $("#srAlert"); a.textContent = ""; setTimeout(()=>{ a.textContent = Object.values(err.map).join(". "); }, 50); }
    else { const box = document.createElement("div"); box.className = "formerr"; box.setAttribute("role","alert"); box.tabIndex = -1; box.textContent = "⚠ " + (err.message || "שגיאה"); form.prepend(box); box.focus(); }
  }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});

/* auto refresh for staff every 30s */
setInterval(async () => {
  if (!session || !data || modalOpen() || document.visibilityState!=="visible") return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  try { await load(); render(); } catch(e){ render(); }
}, 30000);

/* boot */
try { if (store.get("s820_still")) document.body.classList.add("still"); } catch(e){}
(async () => {
  if (session) { try { await load(); } catch(e){ session = null; store.del(SKEY); } }
  render();
})();
</script>
